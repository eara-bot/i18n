buttons:
  remove:
    none: Non sono riuscito a trovare l'elemento che volevi rimuovere...
    done: '{{author}} ha rimosso {{track}} dalla coda.'
  correlated_remove:
    none: Le canzoni in coda non si trovano da nessuna parte...
    done: '{{author}} ha rimosso {{count}} canzoni messe in coda.'
  play_now:
    none: >-
      Non sono riuscito a trovare le canzoni che hai aggiunto in coda, le hai
      già riprodotte?
    not_found: Impossibile trovare quella canzone nella coda.
    done_one: 'Prioritizzata una canzone richiesta da {{requester}}.'
    done_other: 'Prioritizzate {{count}} canzoni richieste da {{requester}}.'
    footer_a: 'Saltato a {{next}} da {{prev}}'
    footer_b: 'Saltato a {{next}}'
  item_actions:
    not_found: Questa canzone non è più in coda.
  previous:
    none: Non ci sono canzoni precedenti...
  skip_to: '{{user}} ha saltato a {{track}}'
  stop: '{{user}} ha fermato il lettore.'
events:
  command_failed:
    message: Questo comando non è riuscito.
    reason:
      unknown: 'Si è verificato un errore imprevisto, segnalalo agli sviluppatori.'
      panic: >-
        L'attività che stava elaborando il tuo comando si è interrotta,
        segnalalo agli sviluppatori.
    footer: 'Fornisci questo ID agli sviluppatori: **{{eid}}**'
  player:
    tips:
      autoplay: 'Mantieni la musica attiva quando la coda termina con {{command}}.'
      crossfade: 'Sapevi che abbiamo il crossfade? Usa {{command}} per configurarlo.'
      effects: 'Dai un tocco diverso alla canzone attuale con {{command}}.'
      history: >-
        Cerchi qualcosa riprodotta in precedenza? {{command}} può mostrare anche
        la cronologia della coda.
      immersive: 'Usa {{spatialize}} o {{orbit}} per rendere più vivace la tua esperienza!'
      loop: >-
        Vuoi riascoltarla? {{command}} può ripetere questa canzone o l'intera
        coda.
      move: 'Riordina o pulisci la coda con {{move_command}} e {{remove_command}}.'
      notifications: >-
        I gestori del server possono scegliere un canale dedicato al lettore con
        {{command}}.
      seek: 'Vai a qualsiasi punto di questa canzone con {{command}}.'
      shuffle: 'Mescola le canzoni in attesa nella coda con {{command}}.'
      voice_status: >-
        I gestori del server possono mostrare la canzone attuale nello stato del
        canale vocale con {{command}}.
    notification:
      join_failed: Non sono riuscito a connettermi al tuo canale vocale.
      playback_failed: 'Riproduzione di {{track}} non riuscita'
      scheduler_failed: >-
        Lo scheduler del lettore per questo server ha avuto un errore. Esegui
        `/leave`, poi `/join` e segnala il problema se dovesse ripetersi.
      playback_stalled: >-
        Troppi tentativi di riproduzione falliti. Se il problema persiste,
        unisciti al nostro server di supporto.
      idle_timeout: 'Il player era inattivo da troppo tempo, quindi mi sono disconnesso.'
      restarting: Eara si sta riavviando e dovrebbe tornare a breve.
    disconnect:
      alone: 'Sono stato lasciato solo, disconnessione <t:{{timestamp}}:R>'
    queue:
      end:
        message: La coda è terminata.
        prompts:
          review:
            message: 'Ti piace {{mention}}? Lasciaci una recensione!'
            button: Lascia una recensione
          vote:
            message: >-
              Ti piace {{mention}}? Vota per noi per aiutare più persone a
              trovarlo!
            button: Vota per noi
          support:
            message: >-
              Hai bisogno di aiuto o vuoi fare due chiacchiere? Unisciti alla
              nostra community Discord!
            button: Unisciti al server
commands:
  debug:
    footer: Condividi questo riepilogo quando chiedi aiuto sul player.
    loop_indefinite: '{{mode}} (indefinito)'
    loop_remaining: '{{mode}} ({{count, number}} rimanenti)'
  dev:
    entitlement_granted: 'Entitlement {{entitlement}} concesso per SKU {{sku}} a guild {{guild}}.'
    player_not_found: 'Nessun player esiste per la guild {{guild}}.'
    joining: 'Connessione a {{channel}} ({{connection}})'
    connected: 'Connesso a {{channel}} ({{connection}})'
  ping:
    message: Pong!
    footer: Hai problemi? Unisciti al nostro **Support Server**!
  stats:
    instance_failed: Recupero istanza non riuscito.
  crossfade:
    current:
      enabled: 'Durata del crossfade impostata su {{duration, number}}s.'
      disabled: Il crossfade è disabilitato.
    updated:
      enabled: 'Durata del crossfade impostata su {{duration, number}}s.'
      disabled: Crossfade disabilitato.
  default_volume:
    current: 'Il volume predefinito per questo server è attualmente {{volume, number}}.'
    updated: 'Volume predefinito aggiornato per questo server a {{volume, number}}.'
  do_vc_status_update:
    current:
      enabled: >-
        Attualmente, {{mention}} aggiornerà lo stato del canale vocale quando la
        canzone corrente cambia.
      disabled: >-
        Attualmente, {{mention}} non aggiornerà lo stato del canale vocale
        quando la canzone corrente cambia.
    updated:
      enabled: >-
        {{mention}} aggiornerà ora lo stato del canale vocale quando la canzone
        corrente cambia.
      disabled: >-
        {{mention}} non aggiornerà più lo stato del canale vocale quando la
        canzone corrente cambia.
  autoplay:
    current:
      enabled: >-
        Attualmente, {{mention}} riprodurrà automaticamente canzoni
        raccomandate.
      disabled: >-
        Attualmente, {{mention}} non sta riproducendo automaticamente canzoni
        raccomandate.
    updated:
      enabled: '{{mention}} riprodurrà ora automaticamente canzoni raccomandate.'
      disabled: '{{mention}} non riprodurrà più automaticamente canzoni raccomandate.'
  notifications:
    channel:
      current:
        none: '{{mention}} non sta inviando notifiche a un canale specifico.'
        some: '{{mention}} sta attualmente inviando notifiche a {{channel}}'
      clear: '{{mention}} non invierà più notifiche a un canale specifico.'
      update: '{{mention}} invierà ora notifiche a {{channel}}'
  leave:
    success_channel: 'Lasciato {{channel}}.'
    destroyed: Player distrutto per questo server.
  join:
    conflict: Sono già in un canale vocale.
    failure: Non sono riuscito a entrare nel canale vocale.
    in_progress: Sto già entrando in quel canale vocale.
    perms:
      missing: >-
        Ho bisogno dei permessi per **visualizzare**, **connettermi** e
        **parlare** in {{channel}}.
    success: 'Ok, sono entrato in {{channel}}.'
  skip:
    success: Saltato.
    to:
      invalid: >-
        Non ho riconosciuto la canzone che mi hai dato. Prova a usare il
        completamento automatico :)
      none: 'Non posso saltare alla canzone indicata, è ancora in coda?'
  seek:
    unseekable: La canzone attuale non è seekable.
    no_duration: La canzone attuale non ha una durata.
    syntax: 'Il timecode deve essere nel formato `mm:ss`'
    out_of_bounds: >-
      La posizione indicata supera la lunghezza della canzone attuale, {{given}}
      > {{length}}
    success: 'Avanzato a {{given}}'
  loop:
    nothing:
      success: Il loop è stato disattivato.
      already: Il loop era già disattivato.
    track:
      indef: Ora riprodurrò indefinitamente la canzone corrente.
      times_one: La canzone corrente verrà ripetuta una volta.
      times_other: 'La canzone corrente verrà ora ripetuta per *{{count, number}} volte*.'
      nuhuh: La canzone corrente è già stata messa in loop.
    queue:
      indef: Ora la coda verrà ripetuta all'infinito.
      times_one: La coda verrà ripetuta una volta.
      times_other: 'La coda verrà ora ripetuta per *{{count, number}} volte*.'
      nuhuh: La coda è già in loop.
  queue:
    use_autocomplete: >-
      Eh? Prova a usare il completamento automatico per selezionare una canzone
      in coda.
    view:
      footer: 'Pagina {{cur, number}}/{{all, number}} ({{tot, number}} totali)'
    move:
      failed: Impossibile spostare quella canzone alla posizione richiesta.
      success: 'Spostata {{track}} al numero {{index, number}}'
    clear:
      none: La coda è vuota.
      success_one: Rimossa 1 canzone dalla coda.
      success_other: 'Rimosse {{count, number}} canzoni dalla coda.'
    remove:
      confirm: 'Sei sicuro di voler rimuovere {{track}} dalla coda?'
      cancelled: 'Ok, non rimuoverò quella canzone.'
      not_found: >-
        La canzone indicata non è stata trovata nella coda, prova a usare il
        completamento automatico.
      success: 'Rimossa {{track}} dalla coda.'
    shuffle:
      too_small: La coda è troppo piccola per essere mescolata.
      success: La coda è stata mescolata.
  pause:
    already: Il lettore è già in pausa.
    success: Ho messo in pausa il lettore.
  resume:
    server_muted: Impossibile riprendere la riproduzione mentre sono mutato dal server.
    already: Il lettore non era in pausa.
    success: Ho ripreso la riproduzione.
  play:
    domain:
