        Devi votare {{mention}} su **top.gg** per avere accesso ai link di
        `{{domain}}`!

        -# $t(common.premium.uninterrupted_access)
    nothing: Nessun risultato per la tua ricerca.
    error: Si è verificato un errore durante il caricamento della tua ricerca.
    invalid_url: Hai inserito un URL non valido.
    queue_full: >-
      La coda non ha abbastanza spazio. Rimuovi alcune canzoni prima di
      aggiungerne altre.
    added: '{{item}} aggiunto alla coda.'
    loaded:
      album_one: 'una canzone dall''album {{collection}}'
      album_other: '{{count, number}} canzoni dall''album {{collection}}'
      artist_one: 'la canzone più ascoltata di *{{collection}}*'
      artist_other: 'le {{count, number}} canzoni più ascoltate di *{{collection}}*'
      playlist_one: 'una canzone dalla playlist *{{collection}}*'
      playlist_other: '{{count, number}} canzoni dalla playlist *{{collection}}*'
  stop:
    success: Il riproduttore è stato fermato.
  volume:
    current: 'Il volume attuale è {{volume, number}}.'
    out_of_bounds: Il volume deve essere compreso tra 0 e 255.
    success: 'Il volume è stato impostato a {{volume, number}}.'
  effects:
    enabled: 'Effetto ''*{{effect}}*'' attivato!'
    disabled: 'Effetto ''*{{effect}}*'' disattivato!'
    cleared: Tutti gli effetti attivi sono stati disattivati!
  immersive:
    disabled: Modalità immersiva disattivata.
