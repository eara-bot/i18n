events:
  command_failed:
    message: Lệnh này đã thất bại.
    reason:
      unknown: >-
        Một lỗi bất ngờ đã xảy ra, vui lòng báo cáo sự cố này cho đội phát
        triển.
      panic: >-
        Nhiệm vụ xử lý lệnh của bạn đã bị lỗi, vui lòng báo cáo điều này cho đội
        phát triển.
    footer: 'Cung cấp mã ID này cho đội phát triển: **{{eid}}**'
  player:
    tips:
      autoplay: 'Giữ nhạc tiếp tục phát khi hàng đợi kết thúc bằng lệnh {{command}}.'
      crossfade: >-
        Bạn có biết chúng tôi có tính năng chuyển tiếp mượt? Sử dụng lệnh
        {{command}} để cấu hình.
      effects: 'Thay đổi cảm giác bài hát hiện tại với lệnh {{command}}.'
      history: >-
        Đang tìm kiếm thứ gì đó đã phát trước đó? Lệnh {{command}} cũng có thể
        hiển thị lịch sử hàng đợi.
      immersive: >-
        Sử dụng {{spatialize}} hoặc {{orbit}} để tăng thêm trải nghiệm nghe
        nhạc!
      loop: >-
        Muốn nghe lại? Lệnh {{command}} có thể lặp lại bài hát này hoặc cả hàng
        đợi.
      move: >-
        Sắp xếp lại hoặc dọn dẹp hàng đợi với lệnh {{move_command}} và
        {{remove_command}}.
      notifications: >-
        Quản trị viên máy chủ có thể chọn kênh phát nhạc riêng biệt bằng lệnh
        {{command}}.
      seek: 'Chuyển đến bất kỳ điểm nào trong bài hát này bằng lệnh {{command}}.'
      shuffle: >-
        Trộn ngẫu nhiên các bài hát đang chờ trong hàng đợi bằng lệnh
        {{command}}.
      voice_status: >-
        Quản trị viên máy chủ có thể hiển thị bài hát hiện tại trong trạng thái
        kênh thoại bằng lệnh {{command}}.
    notification:
      join_failed: Tôi không thể tham gia kênh thoại của bạn.
      playback_failed: 'Phát {{track}} thất bại'
      scheduler_failed: >-
        Lịch biểu trình phát cho máy chủ này đã gặp lỗi. Vui lòng thực hiện
        `/leave`, sau đó là `/join`, và báo cáo nếu lỗi vẫn xảy ra.
      playback_stalled: >-
        Quá nhiều lần phát nhạc thất bại. Nếu tình trạng tiếp diễn, vui lòng
        tham gia Máy chủ Hỗ trợ của chúng tôi.
      idle_timeout: 'Người chơi đã không hoạt động quá lâu, nên tôi đã ngắt kết nối.'
      restarting: Eara đang khởi động lại và sẽ sớm hoạt động trở lại.
    disconnect:
      alone: 'Tôi đã bị bỏ lại một mình, ngắt kết nối <t:{{timestamp}}:R>'
    queue:
      end:
        message: Hàng đợi đã kết thúc.
        prompts:
          review:
            message: 'Thích {{mention}} chứ? Hãy để lại đánh giá cho chúng tôi!'
            button: Để lại đánh giá
          vote:
            message: >-
              Thích {{mention}} chứ? Hãy bình chọn cho chúng tôi để giúp nhiều
              người hơn tìm thấy nó!
            button: Bình chọn cho chúng tôi
          support:
            message: >-
              Cần trợ giúp hay muốn trò chuyện? Tham gia cộng đồng Discord của
              chúng tôi!
            button: Tham gia máy chủ của chúng tôi
