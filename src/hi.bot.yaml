        यहाँ सुनी हर चीज़ स्क्रॉबल करने के लिए {{command}} से अपना Last.fm अकाउंट
        लिंक करें।
      loop: >-
        फिर से सुनना चाहते हैं? {{command}} इस गाने या पूरी कतार को दोहरा सकता
        है।
      move: >-
        {{move_command}} और {{remove_command}} से कतार का क्रम बदलें या उसे साफ़
        करें।
      notifications: >-
        सर्वर मैनेजर {{command}} से प्लेयर के लिए एक अलग चैनल चुन सकते हैं।
      player: >-
        {{command}} से या [वेब प्लेयर]({{url}}) में लाइव लिरिक्स देखें और कतार
        मैनेज करें।
      player_web: >-
        [वेब प्लेयर]({{url}}) में लाइव लिरिक्स देखें और कतार मैनेज करें।
      seek: "{{command}} से इस गाने के किसी भी हिस्से पर जाएँ।"
      shuffle: "{{command}} से कतार में इंतज़ार कर रहे गानों को शफ़ल करें।"
      voice_status: >-
        सर्वर मैनेजर {{command}} से मौजूदा गाने को वॉइस चैनल स्टेटस में दिखा
        सकते हैं।
