      join_failed: मैं आपके वॉइस चैनल से नहीं जुड़ पाया।
      playback_failed: "{{track}} नहीं चल पाया।"
      scheduler_failed: >-
        इस सर्वर का प्लेयर शेड्यूलर फ़ेल हो गया। कृपया `/leave` और फिर `/join`
        चलाएँ, और अगर ऐसा फिर हो तो हमें बताएँ।
      playback_stalled: >-
        प्लेबैक की बहुत सारी कोशिशें फ़ेल हो गईं। अगर ऐसा होता रहे, तो कृपया
        हमारे सपोर्ट सर्वर से जुड़ें।
      idle_timeout: प्लेयर बहुत देर तक निष्क्रिय रहा, इसलिए मैं डिस्कनेक्ट हो गया।
      restarting: Eara रीस्टार्ट हो रहा है और जल्द ही वापस आ जाएगा।
    disconnect:
      alone: मैं बिल्कुल अकेला रह गया हूँ, <t:{{timestamp}}:R> डिस्कनेक्ट हो जाऊँगा।
    queue:
      end:
        message: कतार ख़त्म हो गई है।
        prompts:
          review:
            message: "{{mention}} पसंद आ रहा है? हमें एक रिव्यू दें!"
            button: रिव्यू दें
          vote:
            message: >-
              {{mention}} पसंद आ रहा है? हमें वोट करें, ताकि और लोग इसे ढूँढ
              सकें!
            button: हमें वोट करें
          support:
            message: मदद चाहिए या बस साथ में समय बिताना है? हमारी Discord कम्युनिटी से जुड़ें!
            button: हमारे सर्वर से जुड़ें
          player:
            message: >-
              वेब प्लेयर से चुनें कि आगे क्या चले: खोज, लिरिक्स और कतार, सब एक
              ही जगह।
            button: वेब प्लेयर खोलें
