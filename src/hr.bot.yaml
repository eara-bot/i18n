        Raspored reprodukcije za ovaj server nije uspio. Pokrenite `/leave`,
        zatim `/join` te prijavite ovo ako se ponovno dogodi.
      playback_stalled: >-
        Previše neuspješnih pokušaja reprodukcije. Ako se i dalje nastavlja,
        pridružite se našem Support Serveru.
      idle_timeout: 'Igrač je bio neaktivan predugo, pa sam se odjavio.'
