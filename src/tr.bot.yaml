      join_failed: Ses kanalınıza katılamadım.
      playback_failed: '{{track}} çalınamadı'
      scheduler_failed: >-
        Bu sunucu için oynatıcı zamanlayıcısı başarısız oldu. Lütfen `/leave`,
        ardından `/join` komutlarını çalıştırın ve bu tekrar olursa lütfen
