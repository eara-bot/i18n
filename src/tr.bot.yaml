        Cross-fading özelliğimiz olduğunu biliyor muydunuz? Yapılandırmak için
        {{command}} kullanın.
      effects: 'Geçerli şarkıya farklı bir hava katmak için {{command}} kullanın.'
      history: >-
        Daha önce çalınan bir şey mi arıyorsunuz? {{command}} ayrıca kuyruk
        geçmişini de gösterebilir.
      immersive: 'Deneyiminizi canlandırmak için {{spatialize}} veya {{orbit}} kullanın!'
      loop: >-
        Tekrar duymak mı istiyorsunuz? {{command}} bu şarkıyı veya tüm kuyruğu
        tekrarlayabilir.
      move: >-
        Kuyruğu {{move_command}} ve {{remove_command}} ile yeniden sıralayın
        veya temizleyin.
      notifications: 'Sunucu yöneticileri, {{command}} ile özel bir oynatıcı kanalı seçebilir.'
      seek: 'Geçerli şarkıda herhangi bir noktaya {{command}} ile atlayın.'
      shuffle: 'Kuyruktaki şarkıları {{command}} ile karıştırın.'
