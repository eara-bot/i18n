    disconnect:
      alone: 'I was left all alone, disconnecting <t:{{timestamp}}:R>'
    queue:
      end:
        message: The queue has ended.
        prompts:
          review:
            message: 'Enjoying {{mention}}? Leave us a review!'
            button: Leave a review
          vote:
            message: 'Enjoying {{mention}}? Vote for us to help more people find it!'
            button: Vote for us
          support:
            message: Need help or want to hang out? Join our Discord community!
            button: Join our server
commands:
  debug:
    footer: Share this summary when asking for player help.
    loop_indefinite: '{{mode}} (indefinite)'
    loop_remaining: '{{mode}} ({{count, number}} remaining)'
  dev:
    entitlement_granted: 'Granted entitlement {{entitlement}} for SKU {{sku}} to guild {{guild}}.'
    player_not_found: 'No player exists for guild {{guild}}.'
    joining: 'Joining {{channel}} ({{connection}})'
    connected: 'Connected to {{channel}} ({{connection}})'
  ping:
    message: Pong!
    footer: Having issues? Join our **Support Server**!
  stats:
    instance_failed: Failed to retrieve instance.
  crossfade:
    current:
      enabled: 'Cross-fading duration is set to {{duration, number}}s.'
      disabled: Cross-fading is disabled.
    updated:
      enabled: 'Crossfade duration set to {{duration, number}}s.'
      disabled: Crossfade disabled.
  default_volume:
    current: 'The default volume for this server is currently {{volume, number}}.'
    updated: 'Updated the default volume for this server to {{volume, number}}.'
  do_vc_status_update:
    current:
      enabled: >-
        Currently, {{mention}} will update the voice channel status when the
        current song changes.
      disabled: >-
        Currently, {{mention}} will not update the voice channel status when the
        current song changes.
    updated:
      enabled: >-
        {{mention}} will now update the voice channel status when the current
        song changes.
      disabled: >-
        {{mention}} will no longer update the voice channel status when the
        current song changes.
  autoplay:
    current:
      enabled: 'Currently, {{mention}} will auto-play recommended songs.'
      disabled: 'Currently, {{mention}} is not auto-playing recommended songs.'
    updated:
      enabled: '{{mention}} will now auto-play recommended songs.'
      disabled: '{{mention}} will no longer auto-play recommended songs.'
  notifications:
    channel:
      current:
        none: '{{mention}} is not sending notifications to a specific channel.'
        some: '{{mention}} is currently sending notifications to {{channel}}'
      clear: '{{mention}} will no longer send notifications to a specific channel.'
      update: '{{mention}} will now send notifications to {{channel}}'
  leave:
    success_channel: 'Left {{channel}}.'
    destroyed: Destroyed the player for this server.
  join:
    conflict: I'm already in a voice channel.
    failure: I failed to join that voice channel.
    in_progress: I am already joining that voice channel.
    perms:
      missing: >-
        I need permissions to **view**, **connect**, and **speak** in
        {{channel}}.
    success: 'Okay, I joined {{channel}}.'
  skip:
    success: Skipped.
    to:
      invalid: 'I didn''t recognize the song you gave me. Try using auto-complete :)'
      none: 'I could not skip to that song, is it still in the queue?'
  seek:
    unseekable: The current song is not seekable.
    no_duration: The current song has no duration.
    syntax: 'The timecode must be in the format `mm:ss`'
    out_of_bounds: >-
      The position you gave will exceed the length of the current song,
      {{given}} > {{length}}
    success: 'Seeked to {{given}}'
  loop:
    nothing:
      success: Looping has been disabled.
      already: Looping was already disabled.
    track:
      indef: Now looping the current song indefinitely.
      times_one: The current song will loop once.
      times_other: 'The current song will now loop for *{{count, number}} times*.'
      nuhuh: The current song is already being looped.
    queue:
      indef: Now looping the queue indefinitely.
      times_one: The queue will loop once.
      times_other: 'The queue will now loop for *{{count, number}} times*.'
      nuhuh: The queue is already looping.
  queue:
    use_autocomplete: Hm? Try using the autocomplete to select a queued song.
    view:
      footer: 'Page {{cur, number}}/{{all, number}} ({{tot, number}} total)'
    move:
      failed: Could not move that song to the requested position.
      success: 'Moved {{track}} to #{{index, number}}'
    clear:
      none: The queue was empty.
      success_one: Removed 1 song from the queue.
      success_other: 'Removed {{count, number}} songs from the queue.'
    remove:
      confirm: 'Are you sure you want to remove {{track}} from the queue?'
      cancelled: 'Okay, I won''t remove that song.'
      not_found: 'The provided song was not found in the queue, try using autocomplete.'
      success: 'Removed {{track}} from the queue.'
    shuffle:
      too_small: The queue is too small to be shuffled.
      success: The queue has been shuffled.
  pause:
    already: The player is already paused.
    success: I've paused the player.
  resume:
    server_muted: Cannot resume the player while I'm server muted.
    already: The player wasn't paused.
    success: I've resumed the player.
  play:
    domain:
      other: Sağladığınız bağlantı desteklenmiyor.
      youtube: 'Eara, geçici olarak YouTube bağlantıları için desteği kaldırdı.'
      vote_locked: >
        `{{domain}}` bağlantılarına erişmek için **top.gg** üzerinde {{mention}}
        için oy vermelisiniz!

        -# $t(common.premium.uninterrupted_access)
    nothing: Sorgunuz için hiçbir şey döndürülmedi.
    error: Sorgunuzu yüklerken bir hata oluştu.
    invalid_url: Geçersiz bir URL girdiniz.
    queue_full: Kuyrukta yeterli yer yok. Daha fazla eklemek için bazı şarkıları kaldırın.
    added: '{{item}} kuyruğa eklendi.'
    loaded:
      album_one: 'albumden bir şarkı {{collection}}'
      album_other: '{{count, number}} şarkı albümünden {{collection}}'
      artist_one: '*{{collection}}*''nin en iyi şarkısı'
      artist_other: '*{{collection}}*''nin en iyi {{count, number}} şarkısı'
      playlist_one: '*{{collection}}* çalma listesinden bir şarkı'
      playlist_other: '*{{collection}}* çalma listesinden {{count, number}} şarkı'
  stop:
    success: Oynatıcı durduruldu.
  volume:
    current: 'Geçerli ses düzeyi {{volume, number}}.'
    out_of_bounds: Ses düzeyi 0 ile 255 arasında olmalıdır.
    success: 'Ses düzeyi {{volume, number}} olarak ayarlandı.'
  effects:
    enabled: '''*{{effect}}*'' efekti etkinleştirildi!'
    disabled: '''*{{effect}}*'' efekti devre dışı bırakıldı!'
    cleared: Tüm etkiler temizlendi!
  immersive:
