events:
  command_failed:
    message: Bu komut başarısız oldu.
    reason:
      unknown: 'Beklenmeyen bir hata oluştu, lütfen bunu geliştiricilere bildirin.'
      panic: 'Komutunuzu işleyen görev çöktü, lütfen bunu geliştiricilere bildirin.'
    footer: 'Geliştiricilere bu kimliği verin: **{{eid}}**'
  player:
    tips:
      autoplay: 'Kuyruk bittikten sonra müziğin devam etmesini {{command}} ile sağlayın.'
