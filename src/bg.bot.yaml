events:
  command_failed:
    message: Командата не бе изпълнена.
    reason:
      unknown: 'Възникна непредвидена грешка, моля, докладвайте я на разработчиците.'
      panic: >-
        Задачата, обработваща командата ви, се срина — моля, докладвайте това на
        разработчиците.
    footer: 'Дайте този ID на разработчиците: **{{eid}}**'
  player:
    tips:
      autoplay: 'Пуснете музиката непрекъснато след края на опашката с {{command}}.'
      crossfade: >-
        Знаете ли, че имаме кросфейд? Използвайте {{command}}, за да го
        настроите.
      effects: 'Дайте различен характер на текущата песен с {{command}}.'
      history: >-
        Търсите нещо, което е било свирено по-рано? {{command}} може да покаже и
        историята на опашката.
      immersive: >-
        Използвайте {{spatialize}} или {{orbit}}, за да оживите преживяването
        си!
      loop: >-
        Искате ли да чуете отново? {{command}} може да повтаря тази песен или
        цялата опашка.
      move: >-
        Подредете отново или почистете опашката с {{move_command}} и
        {{remove_command}}.
      notifications: >-
        Администраторите на сървъра могат да изберат специален канал за плеъра с
        {{command}}.
      seek: 'Преминете към всяка част от песента с {{command}}.'
      shuffle: 'Смесете песните в опашката с {{command}}.'
      voice_status: >-
        Администраторите на сървъра могат да показват текущата песен в статуса
        на гласовия канал с {{command}}.
    notification:
      join_failed: Не успях да се присъединя към гласовия ви канал.
      playback_failed: 'Неуспешно изпълнение на {{track}}'
      scheduler_failed: >-
        Графикът на плеъра за този сървър се провали. Моля, изпълнете `/leave`,
        след това `/join` и докладвайте, ако се повтори.
      playback_stalled: >-
        Твърде много неуспешни опити за възпроизвеждане. Ако проблемът продължи,
        моля, присъединете се към нашия сървър за поддръжка.
      idle_timeout: 'Плеърът беше неактивен прекалено дълго, затова се отключих.'
      restarting: Eara се рестартира и скоро трябва да е отново онлайн.
    disconnect:
      alone: 'Оставиха ме сам, отключвам се <t:{{timestamp}}:R>'
    queue:
      end:
        message: Опашката приключи.
        prompts:
          review:
            message: 'Харесва ли ви {{mention}}? Оставете ни отзив!'
            button: Оставете отзив
          vote:
            message: >-
              Харесва ли ви {{mention}}? Гласувайте за нас, за да помогнем на
              повече хора да ни открият!
            button: Гласувайте за нас
          support:
            message: >-
              Нуждаете се от помощ или искате да си побъбрим? Присъединете се
              към нашия Discord общност!
            button: Присъединете се към нашия сървър
