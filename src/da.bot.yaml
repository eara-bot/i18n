events:
  command_failed:
    message: Denne kommando mislykkedes.
    reason:
      unknown: En uventet fejl er opstået. Rapporter venligst dette til udviklerne.
      panic: >-
        Opgaven, der behandlede din kommando, fejlede. Rapporter venligst dette
        til udviklerne.
    footer: 'Giv dette ID til udviklerne: **{{eid}}**'
  player:
    tips:
      autoplay: 'Keep musikken kørende, når køen slutter med {{command}}.'
      crossfade: >-
        Vidste du, at vi har overtoning? Brug {{command}} til at konfigurere
        det.
      effects: 'Giv den nuværende sang en anden følelse med {{command}}.'
      history: >-
        Leder du efter noget, der blev spillet tidligere? {{command}} kan også
        vise kø-historik.
      immersive: 'Brug {{spatialize}} eller {{orbit}} for at forbedre din oplevelse!'
      loop: >-
        Vil du høre det igen? {{command}} kan gentage denne sang eller hele
        køen.
      move: >-
        Omarrangér eller ryd op i køen med {{move_command}} og
        {{remove_command}}.
      notifications: >-
        Serveradministratorer kan vælge en dedikeret afspiller-kanal med
        {{command}}.
      seek: 'Spring til ethvert punkt i denne sang med {{command}}.'
      shuffle: 'Bland sangene, der venter i køen, med {{command}}.'
      voice_status: >-
        Serveradministratorer kan vise den nuværende sang i status for
        talekanalen med {{command}}.
    notification:
      join_failed: Jeg kunne ikke forbinde til din talekanal.
      playback_failed: 'Kunne ikke afspille {{track}}'
      scheduler_failed: >-
        Afspillerplanlægningen for denne server mislykkedes. Kør venligst
        `/leave`, derefter `/join`, og rapportér dette, hvis det sker igen.
      playback_stalled: >-
        For mange mislykkede afspilningsforsøg. Hvis det fortsætter, skal du
        venligst slutte dig til vores Support-server.
      idle_timeout: 'Spilleren var inaktiv i for lang tid, så jeg afbrød forbindelsen.'
    disconnect:
      alone: 'Jeg blev efterladt alene, afbryder <t:{{timestamp}}:R>'
    queue:
      end:
        message: Spillelisten er slut.
        prompts:
          review:
            message: 'Nyder du {{mention}}? Efterlad os en anmeldelse!'
            button: Efterlad en anmeldelse
          vote:
            message: 'Nyder du {{mention}}? Stem for os, så flere kan finde den!'
            button: Stem for os
          support:
            message: >-
              Har du brug for hjælp eller lyst til at hygge? Slut dig til vores
              Discord-fællesskab!
            button: Slut dig til vores server
