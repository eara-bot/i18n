events:
  command_failed:
    message: Tento příkaz selhal.
    reason:
      unknown: 'Došlo k neočekávané chybě, prosíme nahlášte to vývojářům.'
      panic: 'Úloha zpracovávající váš příkaz selhala, prosíme nahlášte to vývojářům.'
    footer: 'Dejte toto ID vývojářům: **{{eid}}**'
  player:
    tips:
      autoplay: 'Udržujte hudbu v chodu i po skončení fronty pomocí {{command}}.'
      crossfade: >-
        Věděli jste, že máme přechody se smícháním? Použijte {{command}} k
        jejich nastavení.
      effects: 'Dodějte aktuální skladbě jiný pocit pomocí {{command}}.'
      history: >-
        Hledáte něco, co bylo hráno dříve? {{command}} může zobrazit také
        historii fronty.
      immersive: >-
        Použijte {{spatialize}} nebo {{orbit}}, abyste oživili své poslechové
        zážitky!
      loop: >-
        Chcete to slyšet znovu? {{command}} může opakovat tuto skladbu nebo
        celou frontu.
      move: >-
        Změňte pořadí nebo vyčistěte frontu pomocí {{move_command}} a
        {{remove_command}}.
      notifications: >-
        Správci serveru mohou vybrat vyhrazený kanál pro přehrávač pomocí
        {{command}}.
      seek: 'Přeskočte na libovolný bod této skladby pomocí {{command}}.'
