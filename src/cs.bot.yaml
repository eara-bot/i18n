        Správci serveru mohou zobrazit aktuální skladbu ve stavu hlasového
        kanálu pomocí {{command}}.
    notification:
      join_failed: Nepodařilo se mi připojit k vašemu hlasovému kanálu.
      playback_failed: 'Přehrávání {{track}} se nezdařilo'
      scheduler_failed: >-
        Plánovač přehrávání pro tento server selhal. Spusťte prosím `/leave`,
        poté `/join` a pokud se to stane znovu, nahlášte to.
      playback_stalled: >-
        Příliš mnoho neúspěšných pokusů o přehrávání. Pokud problém přetrvává,
        připojte se k naší podpůrné skupině.
      idle_timeout: 'Hráč byl příliš dlouho nečinný, takže jsem se odpojil.'
    disconnect:
      alone: 'Byl jsem tu úplně sám, odpojuji <t:{{timestamp}}:R>'
    queue:
      end:
        message: Fronta skončila.
        prompts:
          review:
            message: 'Užíváte si {{mention}}? Napište nám recenzi!'
            button: Napsat recenzi
          vote:
            message: >-
              Užíváte si {{mention}}? Hlasujte pro nás a pomozte více lidem nás
              najít!
            button: Hlasovat pro nás
          support:
            message: >-
              Potřebujete pomoc nebo chcete pokecat? Připojte se k naší komunitě
              na Discordu!
            button: Připojit se na server
