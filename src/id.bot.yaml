        Penjadwal pemutar untuk server ini gagal. Harap jalankan `/leave`, lalu
        `/join`, dan laporkan jika ini terjadi lagi.
      playback_stalled: >-
        Terlalu banyak percobaan pemutaran yang gagal. Jika masalah berlanjut,
        harap bergabung ke Server Dukungan kami.
      idle_timeout: 'Pemutar terlalu lama tidak aktif, sehingga saya memutuskan koneksi.'
      restarting: Eara sedang dimulai ulang dan akan segera kembali.
    disconnect:
      alone: 'Saya ditinggalkan sendirian, terputus <t:{{timestamp}}:R>'
    queue:
      end:
        message: Antrian telah berakhir.
        prompts:
          review:
            message: 'Menikmati {{mention}}? Tinggalkan ulasan untuk kami!'
            button: Tinggalkan ulasan
          vote:
            message: >-
              Menikmati {{mention}}? Pilih kami agar lebih banyak orang bisa
              menemukannya!
            button: Pilih kami
          support:
            message: >-
              Butuh bantuan atau ingin bersantai? Bergabunglah dengan komunitas
              Discord kami!
            button: Bergabunglah ke server kami
