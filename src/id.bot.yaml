        Tugas yang sedang memproses perintah Anda mengalami kegagalan, harap
        laporkan ini kepada pengembang.
    footer: 'Berikan ID ini kepada pengembang: **{{eid}}**'
  player:
    tips:
      autoplay: 'Teruskan musik saat antrian berakhir dengan {{command}}.'
      crossfade: >-
        Apakah Anda tahu kami memiliki efek silang (cross-fading)? Gunakan
        {{command}} untuk mengaturnya.
      effects: 'Beri nuansa berbeda pada lagu saat ini dengan {{command}}.'
      history: >-
        Mencari sesuatu yang diputar sebelumnya? {{command}} juga dapat
        menampilkan riwayat antrian.
      immersive: 'Gunakan {{spatialize}} atau {{orbit}} untuk memperkaya pengalaman Anda!'
      loop: >-
        Ingin mendengarnya lagi? {{command}} dapat mengulangi lagu ini atau
        seluruh antrian.
      move: >-
        Atur ulang atau bersihkan antrian dengan {{move_command}} dan
        {{remove_command}}.
      notifications: 'Manajer server dapat memilih saluran pemutar khusus dengan {{command}}.'
      seek: 'Lompat ke bagian mana pun dari lagu ini dengan {{command}}.'
