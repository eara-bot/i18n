      ID d'erreur `{{eid}}` · partage-le sur notre serveur d'assistance si ça
      se reproduit.
    usage: "Ça ne semble pas correct. Voici comment l'utiliser :"
  player:
    tips:
      autoplay: >-
        Garde la musique en route quand la file d'attente se termine avec
        {{command}}.
      crossfade: >-
        Tu savais qu'on a un fondu enchaîné ? Utilise {{command}} pour le
        configurer.
      effects: Donne une autre ambiance au titre en cours avec {{command}}.
      history: >-
        Tu cherches un titre passé plus tôt ? {{command}} peut aussi afficher
