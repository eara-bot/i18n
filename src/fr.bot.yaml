        label: Pas de doublons
        about: Les titres déjà dans la file d'attente ne peuvent pas être rajoutés.
      fair:
        label: File équitable
        about: Alterne entre les personnes qui ajoutent des titres.
      leave_cleanup:
        label: Nettoyage au départ
        about: >-
          Retire les titres d'un membre 30 secondes après qu'il a quitté
