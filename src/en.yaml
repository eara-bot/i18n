checks:
  guild_only: This command may only be used in a server.
  not_playing: I'm not playing music in this server.
  user_vc_none: You must be in a voice channel to use this command.
  user_vc_diff: You must be in the same voice channel as me to use this command.
  user_vc_diff_btn: You must be in the same voice channel as me to use this button.
  queue_empty: The queue is empty.
  not_interactable: You cannot interact with this message.
  maintenance: The bot is undergoing maintenance, check back later.
common:
  join_our_server: "Join our [*Discord Server*](%{invite} ) for more information"
  message_deleted: "*Message was deleted*"
  requested_by: Requested By
  position: Position
  vote: Vote on Top.gg
  discord_server: Discord Server
  premium:
    sku_or_vote_required: This server requires a **Premium Subscription** to access this command. Alternatively, you can vote to receive *up-to* 12 hours of uninterrupted access.
    sku_required: This server requires a **Premium Subscription** to access this command.
    vote_required: |
      You must vote for %{mention} on **top.gg** to gain access to this command. 
      -# After voting you will receive *up-to* 12 hours of uninterrupted access!
events:
  command_failed: 
    message: This command has failed.
    footer: 'Give this ID to the developers: **%{eid}**'
  player:
    skip: 
      to_track: '%{user_mention} skipped %{track}.'
      to_next: '%{user_mention} skipped to the next song.'
    disconnect:
      manual: I was manually disconnected from the voice channel.
      alone: I was left all alone, disconnecting <t:%{timestamp}:R>
    track:
      exception:
        time_out: The song timed out, please try again later.
        no_support: The song is not supported by the player.
        no_mirror: Could not find a suitable source to play from, do not attempt replaying the song.
        no_media: Failed to retrieve the media for the song, try replaying it.
        failure: Failed to play %{track}, do not attempt to replay it.
      stuck: The player got stuck. Skipping to the next song...
    queue:
      next:
        requested_by: Requested by %{user_mention}
        auto_playing: ':sparkles: Auto-playing Recommended Tracks'
      end: Queue ended.
commands:
  ###
  ### Information Commands
  ###
  info:
    footer: Build Information
  ping:
    footer: Having issues? Join our Discord Server.
  ###
  ### Setting Commands
  ###
  default_volume:
    current: The default volume for this server is currently %{volume}.
    updated: Updated the default volume for this server to %{volume}.
  autoplay:
    current:
      enabled: '%{mention} is auto-play recommended songs.'
      disabled: '%{mention} is not auto-playing recommended songs.'
    updated:
      enabled: '%{mention} will now auto-play recommended songs.'
      disabled: '%{mention} will no longer auto-play recommended songs.'
  ###
  ### Music Commands
  ###
  fix:
    no_vc: The bot isn't in a voice channel... try using /join?
    success: I've attempted to fix connection issues.
  leave:
    success: Okay, I left your voice channel.
  join:
    perms:
      missing: >-
        I need permissions to **view**, **connect**, and **speak** in
        %{channel}.
      error: >-
        I failed to fetch permissions for %{channel}, report this to the
        developers.
    success: Okay, I joined %{channel}.
  skip:
    current:
      some: Skipped %{track}.
      none: Skipped to the next song.
    to:
      some: Skipped to %{track}.
      none: The provided song was not found in the queue.
  seek:
    unseekable: The current track is not seekable.
    no_duration: The current track has no duration.
    out_of_bounds: >-
      The position you gave will exceeed the length of the current song, %{given} >
      %{length}
    success: Seeked to %{given}
  loop:
    nothing:
      success: Looping has been disabled.
      already: Looping was already disabled.
    track:
      indef: Now looping the the current song indefinitely.
      times: The current song will now loop for *%{loop_times} times*.
      nuhuh: The current song is already been looped.
    queue:
      indef: Now looping the queue indefinitely.
      times: The queue will now loop for *%{loop_times} times*.
      nuhuh: The queue is already looping.
  queue:
    use_autocomplete: Hm? Try using the autocomplete to select a queued song.
    view:
      footer: Page %{cur}/%{all} (%{tot} total)
    move:
      not_found: The provided song was not found in the queue.
      pointless: The provided song is already at that position.
      success: "Moved %{track} to #%{index}"
    clear:
      confirm: Are you sure you want to clear the queue?
      cancelled: The queue was not cleared.
      success: The queue has been cleared!
    remove:
      not_found: The provided song was not found in the queue, try using autocomplete.
      success: Removed %{track} from the queue.
    shuffle:
      too_small: The queue is too small to be shuffled.
      success: The queue has been shuffled.
  pause:
    already: The player is already paused.
    success: I've paused the player.
  resume:
    already: The player wasn't paused
    success: I've unpaused the player.
  play:
    domain:
      other: The link you provided is not supported
      youtube: Eara has temporarily removed support for YouTube links.
    nothing: Nothing was returned for your query.
    error: An error occurred while loading your query.
    queued_playlist: Queued %{tracks} songs from *%{playlist}*
    queued_track: Queued %{track}
  stop:
    success: The player has been stopped.
  volume:
    current: The current volume is %{volume}.
    out_of_bounds: The volume must be between 0 and 1000.
    success: The volume has been set to %{volume}.
  effects:
    enabled: Enabled the '*%{effect}*' effect!
    disabled: Disabled the '*%{effect}*' effect!
  lyrics:
    error: >+
      An error occurred while fetching the lyrics for %{track}. 
      Do not attempt to retry.
    missing: No lyrics available for %{track}.
