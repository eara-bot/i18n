        Привяжите аккаунт Last.fm через {{command}}, чтобы скробблить всё, что
        вы здесь слушаете.
      loop: >-
        Хотите послушать ещё раз? {{command}} может повторять этот трек или всю
        очередь.
      move: >-
        Меняйте порядок и чистите очередь с помощью {{move_command}} и
        {{remove_command}}.
      notifications: >-
        Администраторы сервера могут выбрать отдельный канал для плеера через
        {{command}}.
      player: >-
        Следите за текстом песни в реальном времени и управляйте очередью через
        {{command}} или в [веб-плеере]({{url}}).
      player_web: >-
        Следите за текстом песни в реальном времени и управляйте очередью в
        [веб-плеере]({{url}}).
      seek: Перейдите к любому моменту трека с помощью {{command}}.
      shuffle: Перемешайте треки в очереди с помощью {{command}}.
      voice_status: >-
        Администраторы сервера могут показывать текущий трек в статусе
        голосового канала через {{command}}.
