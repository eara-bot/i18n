    get_premium: Получить Премиум
    vote_locks_premium: '**Премиум** убирает необходимость голосовать для всего сервера.'
buttons:
  remove:
    none: 'Не удалось найти трек, который вы хотели удалить...'
    done: '{{author}} удалил(а) {{track}} из очереди.'
  correlated_remove:
    none: Очередь с добавленными треками больше не существует...
    done: '{{author}} удалил(а) {{count}} трек(ов) из очереди.'
  play_now:
    none: >-
      Не удалось найти добавленные вами треки в очереди, может, вы уже их
      прослушали?
    not_found: Не удалось найти этот трек в очереди.
    done_one: 'Отдан приоритет одному треку, запрошенному {{requester}}.'
    done_other: 'Отдан приоритет {{count}} трекам, запрошенным {{requester}}.'
    footer_a: 'Перешли с {{prev}} на {{next}}'
    footer_b: 'Перешли на {{next}}'
  item_actions:
    not_found: Этого трека больше нет в очереди.
  previous:
    none: Предыдущих треков нет...
  skip_to: '{{user}} перешёл(а) на {{track}}'
  stop: '{{user}} остановил(а) проигрыватель.'
events:
  command_failed:
    message: Выполнение команды не удалось.
    reason:
      unknown: >-
        Произошла непредвиденная ошибка, пожалуйста, сообщите об этом
        разработчикам.
      panic: >-
        Задача, обрабатывавшая вашу команду, завершилась сбоем, пожалуйста,
        сообщите об этом разработчикам.
    footer: 'Передайте этот ID разработчикам: **{{eid}}**'
  player:
    tips:
      autoplay: >-
        Продолжайте воспроизведение музыки после окончания очереди с помощью
        {{command}}.
      crossfade: >-
        Знаете ли вы, что у нас есть кроссфейд? Используйте {{command}}, чтобы
        настроить его.
      effects: 'Придайте текущему треку иное звучание с помощью {{command}}.'
      history: >-
        Ищете то, что уже играло? {{command}} также может показать историю
        очереди.
      immersive: >-
        Используйте {{spatialize}} или {{orbit}}, чтобы улучшить своё
        впечатление от прослушивания!
      loop: >-
        Хотите прослушать снова? {{command}} может повторить этот трек или всю
        очередь.
      move: >-
        Измените порядок или очистите очередь с помощью {{move_command}} и
        {{remove_command}}.
      notifications: >-
        Администраторы сервера могут выбрать выделенный канал для проигрывателя
        с помощью {{command}}.
      seek: 'Перейдите в любую точку этого трека с помощью {{command}}.'
      shuffle: 'Перемешайте треки, ожидающие в очереди, с помощью {{command}}.'
      voice_status: >-
        Администраторы сервера могут отображать текущий трек в статусе
        голосового канала с помощью {{command}}.
    notification:
      join_failed: Не удалось подключиться к вашему голосовому каналу.
      playback_failed: 'Не удалось воспроизвести {{track}}'
      scheduler_failed: >-
        Планировщик проигрывателя для этого сервера завершился с ошибкой.
        Пожалуйста, выполните `/leave`, затем `/join`, и сообщите о проблеме,
        если она повторится.
      playback_stalled: >-
        Слишком много неудачных попыток воспроизведения. Если это продолжится,
        присоединяйтесь к нашему серверу поддержки.
      idle_timeout: 'Игрок простаивал слишком долго, поэтому я отключился.'
      restarting: Eara перезапускается и скоро должна вернуться.
    disconnect:
      alone: 'Меня оставили одного, отключаюсь <t:{{timestamp}}:R>'
    queue:
      end:
        message: Очередь закончилась.
        prompts:
          review:
            message: 'Нравится {{mention}}? Оставьте нам отзыв!'
            button: Оставить отзыв
          vote:
            message: >-
              Нравится {{mention}}? Проголосуйте за нас, чтобы помочь большему
              количеству людей найти нас!
            button: Проголосовать за нас
          support:
            message: >-
              Нужна помощь или хотите пообщаться? Присоединяйтесь к нашему
              сообществу в Discord!
            button: Присоединиться к серверу
