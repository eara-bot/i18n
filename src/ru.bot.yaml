    footer: 'Предоставьте разработчикам это: {{eid}}'
  player:
    disconnect:
      alone: Меня оставили в одиночестве, ливаю <t:{{timestamp}}:R>
commands:
  ###
  ### Information Commands
  ###
  ping:
    footer: Есть проблемьі? Заходите на наш Дискорд сервер
  ###
  ### Setting Commands
  ###
  default_volume:
    current: Стандартная громкость в этом сервере сейчас {{volume}}
    updated: Стандартная громкость теперь {{volume}}
  ###
  ### Music Commands
  ###
  join:
    perms:
      missing: >-
        Мне нужньі права **Говорить**, **Просмотр** и **Подключатся** в {{channel}}
    success: Окей, я зашла в {{channel}}
  skip:
    to:
      none: Этого трека нету в очереди
  seek:
    unseekable: Текущий трек нельзя перемотать
    no_duration: Текущий трек не имеет длину
    out_of_bounds: >-
      Позиция которую вьі предоставили превзойдет длину трека, {{given}} >
      {{length}}
    success: Перемотала до {{given}}
  loop:
    nothing:
      success: Повтор вьіключен
      already: Повтор уже бьіл вьіключен
    track:
      indef: Теперь этот трек будет повторятся
      times: Теперь этот трек повторится *{{loop_times}}*×
      nuhuh: Текущий трек уже повторяется
    queue:
      indef: Теперь очередь будет повторятся
      times: Теперь очередь повторится *{{loop_times}}*×
      nuhuh: Вся очередь уже повторяется
  queue:
    use_autocomplete: Хм? Попробуйте нажать опции которьіе автоматически показьіваются
    view:
      footer: Страница {{cur}}/{{all}} (всего {{tot}})
    move:
      success: "{{track}} перемещен на #{{index}}"
    clear:
      success: Очередь очищена!
    remove:
      not_found: Трек не найден, попробуйте использовать опции которьіе автоматически показьіваются
      success: Убрала трек {{track}} из очереди
    shuffle:
      too_small: Очередь слишком мала чтобьі перемешивать
      success: Очередь перемешана
  pause:
    already: Проигрьівач уже приостановлен
    success: Я приостановила проигрьівач
  resume:
    already: Проигрьіватель не приостановлен
    success: Я возобновила проигрьіватель
  play:
    domain:
      other: Ссылка которую вы дали, не поддерживается
      youtube: Эта ссылка пока что не поддерживается из-за ограничений со стороны ютуба. Попробуйте позже, моим разработчикам их нужно обойти
        #      youtube: Eara прекратила поддержку ссылок с YouTube, из-за их ограничений на сторонние клиенты. Ссылки с других платформ, как SoundCloud или Spotify, всё ещё работают нормально
    nothing: Ничего не найдено по запросу
    error: Произошла ошибка при загрузке вашего запроса
  stop:
    success: Проигрьіватель остановлен
  volume:
    current: Сейчас громкость {{volume}}
    out_of_bounds: Громкость должна бьіть между 0 и 1000
    success: Громкость установлена на {{volume}}
  effects:
    enabled: Эффект '*{{effect}}*' включен!
    disabled: Эффект '*{{effect}}*' вьіключен!