  vote: Проголосуйте на Top.gg
  discord_server: Сервер поддержки
  remove: Удалить
  play_now: Воспроизвести сейчас
  next: Следующий
  previous: Предыдущий
  unknown_artist: Неизвестный исполнитель
  unavailable_track: '[недоступные метаданные трека]'
  unknown_url: Неизвестный URL
  unsupported_url: Неподдерживаемый URL
  source_url: '{{source}} URL'
  unknown: Неизвестно
  unknown_channel: Неизвестный канал
  none: Нет
  not_available: Н/Д
  'yes': Да
  'no': Нет
  track: Трек
  queue: Очередь
  state:
    loading: Загрузка
    paused: На паузе
    playing: Воспроизводится
    idle: Бездействие
    active: Активно
    'off': Выключено
    disconnected: Отключено
    joining: Подключение
    connected: Подключено
  confirmation:
