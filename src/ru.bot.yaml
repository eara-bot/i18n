            message: Нравится {{mention}}? Оставьте нам отзыв!
            button: Оставить отзыв
          vote:
            message: >-
              Нравится {{mention}}? Проголосуйте за нас, чтобы больше людей
              узнали о нас!
            button: Проголосовать
          support:
            message: >-
              Нужна помощь или хотите пообщаться? Заходите в наше сообщество в
              Discord!
            button: Зайти на сервер
          player:
