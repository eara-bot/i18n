events:
  command_failed:
    message: Что-то пошло не так
    reason:
      unknown: Попробуйте ещё раз чуть позже.
      player_restarted: Плеер пришлось перезапустить. Попробуйте ещё раз.
    footer: >-
      ID ошибки `{{eid}}` · если это повторяется, поделитесь им на нашем
      сервере поддержки.
    usage: "Что-то не так. Вот как этим пользоваться:"
  player:
    tips:
      autoplay: >-
        Не дайте музыке смолкнуть после конца очереди — включите {{command}}.
      crossfade: >-
        А вы знали, что у нас есть кроссфейд? Настройте его через {{command}}.
      effects: Придайте текущему треку новое звучание с помощью {{command}}.
      history: >-
        Ищете то, что играло раньше? {{command}} также показывает историю
        очереди.
      immersive: Попробуйте {{spatialize}} или {{orbit}}, чтобы оживить звучание!
