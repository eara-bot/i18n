    message: Tämä komento epäonnistui.
    reason:
      unknown: 'Odottamaton virhe tapahtui, ilmoita tästä kehittäjille.'
      panic: 'Tehtävä, joka käsittelee komentoasi, kaatui, ilmoita tästä kehittäjille.'
    footer: 'Anna tämä tunniste kehittäjille: **{{eid}}**'
  player:
    tips:
      autoplay: 'Pidä musiikki soimassa jonon päätyttyä komennolla {{command}}.'
