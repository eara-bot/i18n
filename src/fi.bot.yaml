        Tämän palvelimen soitinsuunnitelma epäonnistui. Suorita `/leave`, sitten
        `/join`, ja ilmoita tästä, jos se toistuu.
      playback_stalled: >-
        Liian monta virheellistä toistoyritystä. Jos ongelma jatkuu, liity
        tukipalvelimeemme.
      idle_timeout: 'Toistin oli poissa käytöstä liian pitkään, joten katkaisin yhteyden.'
