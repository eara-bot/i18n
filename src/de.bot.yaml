  do_vc_status_update:
    current:
      enabled: >-
        Derzeit wird der Status des Sprachkanals vom aktuellen Song aus, wenn
        {{mention}} ändern.
      disabled: >-
        Derzeit wird der Status des Sprachkanals vom aktuellen Song aus, wenn
        {{mention}} nicht ändern.
    updated:
      enabled: >-
        {{mention}} wird ab sofort den Status des Sprachkanals beim Wechsel des
