        about: Lässt die Musik mit ähnlichen Songs weiterlaufen, wenn die Warteschlange leer ist.
      vc_status:
        label: Sprachkanalstatus
        about: Zeigt den laufenden Song als Status des Sprachkanals an.
      auto_pause:
