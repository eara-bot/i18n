        about: >-
          Ein 24/7-Player pausiert, solange niemand im Call ist, und spielt
          weiter, sobald jemand beitritt.
      notifications:
        label: Now-Playing-Kanal
        about: >-
          Wo ich jeden Song poste. Leer lassen, um dort zu posten, wo die Musik
          gestartet wurde.
        placeholder: Der Kanal, in dem die Musik gestartet wurde
    dj:
      mode:
        label: DJ-Modus
        about: >-
          Nur DJs können den Player steuern. Alle können weiterhin Songs
          hinzufügen und fürs Überspringen voten.
      role:
        label: DJ-Rolle
        about: >-
          Mitglieder mit dieser Rolle sind DJs, ebenso alle mit „Server
          verwalten“ oder jede Person, die als einzige mit mir im Call zuhört.
        placeholder: Keine DJ-Rolle
      max_volume:
        label: Lautstärkelimit
        about: Die höchste Lautstärke, die jemand ohne DJ-Rechte einstellen kann.
        none: Kein Limit
        input: Von 0 bis 250. Leer lassen für kein Limit.
      vote_skip:
        label: Stimmen zum Überspringen
        about: Der Anteil der Zuhörer, der nötig ist, um einen Song zu überspringen.
        none: Mehr als die Hälfte
        value: "{{percent, number}} %"
        input: Ein Prozentwert von 1 bis 100. Leer lassen für mehr als die Hälfte.
    queue:
      no_duplicates:
        label: Keine Duplikate
        about: Songs, die schon in der Warteschlange sind, können nicht erneut hinzugefügt werden.
      fair:
        label: Faire Warteschlange
        about: Wechselt zwischen den Leuten ab, die Songs hinzufügen.
      leave_cleanup:
        label: Aufräumen beim Verlassen
        about: Entfernt die Songs einer Person 30 Sekunden, nachdem sie den Call verlassen hat.
      max_songs:
        label: Songs pro Person
        about: Wie viele Songs jemand ohne DJ-Rechte in der Warteschlange haben kann.
        none: Kein Limit
        input: Von 1 bis 1000. Leer lassen für kein Limit.
      max_length:
        label: Maximale Songlänge
        about: Der längste Song, den jemand ohne DJ-Rechte hinzufügen kann.
        none: Kein Limit
        value_one: 1 Minute
        value_other: "{{count, number}} Minuten"
        input: In Minuten, von 1 bis 1440. Leer lassen für kein Limit.
    voice:
      channels:
        label: Sprachkanäle
        about: Wo ich spielen kann. Leer lassen, um in jedem Sprachkanal zu spielen.
        placeholder: Jeder Sprachkanal
    bot:
      always_on:
        label: 24/7-Kanal
        about: >-
          Ein Kanal, dem dieser Bot von selbst beitritt und in dem er bleibt,
          auch wenn die Musik stoppt.
        placeholder: Keiner
        taken: >-
          {{bot}} bleibt schon rund um die Uhr in diesem Kanal. Wähl einen
          anderen.
      voice:
        label: Sprachkanäle
        about: >-
          Wo dieser Bot spielen kann. Leer lassen, um den Sprachkanälen des
          Servers zu folgen.
        any: >-
          Dieser Bot kann in jedem Sprachkanal spielen, den der Server erlaubt.
          Wähl welche aus, um ihn darauf zu beschränken.
        placeholder: Sprachkanäle des Servers
      notifications:
        label: Now-Playing-Kanal
        about: Wo dieser Bot jeden Song postet, statt im Kanal des Servers.
        placeholder: Kanal des Servers
      volume:
        label: Startlautstärke
        about: Wie laut dieser Bot startet, statt mit der Lautstärke des Servers.
        none: Wie der Server ({{volume, number}})
        input: Von 0 bis 250. Leer lassen, um die des Servers zu nutzen.
