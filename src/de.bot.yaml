    get_premium: Premium erhalten
    vote_locks_premium: '**Premium** entfernt das Stimmungs-Lock für den gesamten Server.'
buttons:
  remove:
    none: 'Ich habe den Artikel, den Sie entfernen wollten, nicht finden können...'
    done: '{{author}} hat {{track}} aus der Warteschlange entfernt.'
  correlated_remove:
    none: Die gesuchten Musikstücke sind nicht mehr verfügbar...
    done: '{{author}} hat {{count}} Songs aus der Warteschlange entfernt.'
  play_now:
    none: >-
      Ich konnte die von Ihnen hinzugefügten Songs in der Warteschlange nicht
      finden, haben Sie sie bereits abgespielt?
    not_found: Konnte den Song in der Warteschlange nicht finden.
    done_one: 'Ein von {{requester}} angeforderter Song hat Vorrang.'
    done_other: '{{count}} von {{requester}} angeforderte Songs haben Vorrang.'
    footer_a: 'Zu {{next}} gesprungen von {{prev}}'
    footer_b: 'Zu {{next}} gesprungen'
  item_actions:
    not_found: Dieser Song befindet sich nicht mehr in der Warteschlange.
  previous:
    none: Es gibt keine vorherigen Songs...
  skip_to: '{{user}} ist zu {{track}} gesprungen'
  stop: '{{user}} hat den Wiedergabestopp gestartet.'
events:
  command_failed:
    message: Dieser Befehl ist fehlgeschlagen.
    reason:
      unknown: >-
        Ein unerwarteter Fehler ist aufgetreten. Bitte melden Sie dies an die
        Entwickler.
      panic: 'Die Aufgabe wurde abgebrochen, bitte melden Sie dies an die Entwickler.'
    footer: 'Bitte geben Sie diese ID an die Entwickler: **{{eid}}**'
  player:
    tips:
      autoplay: >-
        Halten Sie die Musik auch nach Ende der Warteschlange mit {{command}}
        weiter.
      crossfade: >-
        Wussten Sie, dass wir Crossfading haben? Verwenden Sie {{command}}, um
        dies zu konfigurieren.
      effects: 'Geben Sie dem aktuellen Song eine andere Note mit {{command}}.'
      history: >-
        Suchen Sie nach etwas, das früher gespielt wurde? {{command}} kann auch
        die Warteschlange-Historie anzeigen.
      immersive: >-
        Verwenden Sie {{spatialize}} oder {{orbit}}, um Ihre Erfahrung
        aufzulockern!
      loop: >-
        Wollen Sie es noch einmal hören? {{command}} kann diesen Song oder die
        gesamte Warteschlange wiederholen.
      move: >-
        Ordnen Sie die Warteschlange neu oder reinigen Sie diese mit
        {{move_command}} und {{remove_command}}.
      notifications: >-
        Servermanager können einen dedizierten Spielerkanal mit {{command}}
        auswählen.
      seek: 'Springen Sie zu einem beliebigen Punkt in diesem Song mit {{command}}.'
      shuffle: 'Mischen Sie die Songs in der Warteschlange mit {{command}}.'
      voice_status: >-
        Servermanager können den aktuellen Song im Sprachkanal-Status mit
        {{command}} anzeigen.
    notification:
      join_failed: Ich bin Ihrem Sprachkanal nicht beigetreten.
      playback_failed: '{{track}} konnte nicht abspielt werden.'
      scheduler_failed: >-
        Die Player-Scheduler für diesen Server ist fehlgeschlagen. Bitte führen
        Sie `/leave`, dann `/join` aus, und berichten Sie von diesem Fall, falls
        es erneut passiert.
      playback_stalled: >-
        Zu viele fehlgeschlagene Abspielversuche. Bitte treten Sie unserem
        Support-Server bei, wenn dies weitergeht.
      idle_timeout: 'Der Spieler war zu lange inaktiv, daher habe ich mich getrennt.'
      restarting: Eara wird neu gestartet und sollte in Kürze wieder verfügbar sein.
    disconnect:
      alone: 'Ich war ganz allein zurückgelassen und trenne mich <t:{{timestamp}}:R>'
    queue:
      end:
        message: Die Warteschlange ist zu Ende.
        prompts:
          review:
            message: 'Genießt {{mention}}? Hinterlassen Sie uns eine Bewertung!'
            button: Bewertung hinterlassen
          vote:
            message: >-
              Genießt {{mention}}? Stimmen Sie für uns ab, um mehr Menschen zu
              helfen, sie zu finden!
            button: Für uns abstimmen
          support:
            message: >-
              Brauchen Sie Hilfe oder möchten Sie Klönen? Treten Sie unserer
              Discord-Community bei!
            button: Unser Server beitreten
