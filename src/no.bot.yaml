events:
  command_failed:
    message: Denne kommandoen mislyktes.
    reason:
      unknown: 'En uventet feil har oppstått, vennligst rapporter dette til utviklerne.'
      panic: >-
        Oppgaven som behandlet din kommando har krasjet, vennligst rapporter
        dette til utviklerne.
    footer: 'Giv denne ID-en til utviklerne: **{{eid}}**'
  player:
    tips:
      autoplay: 'Fortsett med musikken når køen er tom med {{command}}.'
      crossfade: 'Visste du at vi har kryssfading? Bruk {{command}} for å konfigurere det.'
      effects: 'Gi den nåværende sangen en annen følelse med {{command}}.'
      history: >-
        Ser du etter noe som ble spilt tidligere? {{command}} kan også vise
        køhistorikk.
      immersive: >-
        Bruk {{spatialize}} eller {{orbit}} for å gjøre opplevelsen din mer
        levende!
      loop: >-
        Vil du høre det igjen? {{command}} kan gjenta denne sangen eller hele
        køen.
      move: >-
        Reorganiser eller rydd opp i køen med {{move_command}} og
        {{remove_command}}.
      notifications: >-
        Serveradministratorer kan velge en dedikert spillerkanal med
        {{command}}.
      seek: 'Hopp til et hvilket som helst punkt i denne sangen med {{command}}.'
      shuffle: 'Bland om på sangene som venter i køen med {{command}}.'
      voice_status: >-
        Serveradministratorer kan vise den nåværende sangen i statusen til
        stemmekanalen med {{command}}.
    notification:
      join_failed: Jeg klarte ikke å koble meg til din stemmekanal.
      playback_failed: 'Kunne ikke spille av {{track}}'
      scheduler_failed: >-
        Planleggeren for spilleren på denne serveren mislyktes. Vennligst kjør
        `/leave`, deretter `/join`, og rapporter dette hvis det skjer igjen.
      playback_stalled: >-
        For mange mislykkede avspillingsforsøk. Hvis dette fortsetter, vennligst
        bli med i vår Support-server.
      idle_timeout: 'Spilleren var inaktiv for lenge, så jeg koblet fra.'
      restarting: Eara starter på nytt og bør snart være tilbake.
    disconnect:
      alone: 'Jeg ble helt alene, koble fra <t:{{timestamp}}:R>'
    queue:
      end:
        message: Køen har avsluttet.
        prompts:
          review:
            message: 'Nytter du {{mention}}? Venn oss med en omtale!'
            button: Legg igjen en omtale
          vote:
            message: >-
              Nytter du {{mention}}? Stem på oss for å hjelpe flere med å finne
              den!
            button: Stem på oss
          support:
            message: >-
              Trenger du hjelp eller bare lyst til å henge ut? Bli med i vår
              Discord-gemenskap!
            button: Bli med på serveren vår
