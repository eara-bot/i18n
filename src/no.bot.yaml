buttons:
  remove:
    none: Jeg kunne ikke finne elementet du ønsket å fjerne...
    done: '{{author}} fjernet {{track}} fra køen.'
  correlated_remove:
    none: 'Sporene som ble lagt i kø, finnes ikke noe sted...'
