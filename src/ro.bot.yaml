checks:
  guild_only: Thisă comandă poate fi folosită doar pe un server.
  not_playing: Nu redau muzică pe acest server.
  user_vc_none: Trebuie să fii într-un canal vocal pentru a folosi această comandă.
  user_vc_diff: >-
    Trebuie să fii în același canal vocal ca mine pentru a folosi această
