events:
  command_failed:
    message: Щось пішло не так
    reason:
      unknown: Спробуйте ще раз за мить.
      player_restarted: Плеєр довелося перезапустити. Спробуйте ще раз.
    footer: >-
      ID помилки `{{eid}}` · надішліть його на наш сервер підтримки, якщо це
      повторюється.
    usage: "Щось не так. Ось як цим користуватися:"
  player:
    tips:
      autoplay: Музика не зупиниться, коли черга скінчиться, з {{command}}.
      crossfade: >-
        Чи знали ви, що в нас є плавні переходи? Налаштуйте їх за допомогою
        {{command}}.
      effects: Додайте поточній пісні іншого звучання з {{command}}.
      history: >-
        Шукаєте те, що грало раніше? {{command}} також показує історію черги.
      immersive: Оживіть звучання з {{spatialize}} або {{orbit}}!
      last_fm: >-
        Підключіть свій акаунт Last.fm через {{command}}, щоб скробити все, що
        слухаєте тут.
      loop: >-
        Хочете послухати ще раз? {{command}} повторить цю пісню або всю чергу.
      move: >-
        Змінюйте порядок і прибирайте чергу з {{move_command}} та
        {{remove_command}}.
      notifications: >-
        Керівники сервера можуть вибрати окремий канал для плеєра через
        {{command}}.
      player: >-
        Стежте за текстом пісні в реальному часі й керуйте чергою з {{command}}
        або у [вебплеєрі]({{url}}).
      player_web: >-
        Стежте за текстом пісні в реальному часі й керуйте чергою у
        [вебплеєрі]({{url}}).
      seek: Перейдіть до будь-якого моменту пісні з {{command}}.
      shuffle: Перемішайте пісні в черзі з {{command}}.
      voice_status: >-
        Керівники сервера можуть показувати поточну пісню в статусі голосового
        каналу через {{command}}.
    notification:
      join_failed: Не вдалося приєднатися до вашого голосового каналу.
      playback_failed: Не вдалося відтворити {{track}}.
      scheduler_failed: >-
        Планувальник плеєра на цьому сервері зламався. Виконайте `/leave`, потім
        `/join`, і повідомте нам, якщо це повториться.
      playback_stalled: >-
        Забагато невдалих спроб відтворення. Якщо це триватиме, приєднуйтеся до
        нашого сервера підтримки.
      idle_timeout: Плеєр надто довго був неактивний, тож я від'єднався.
      restarting: Eara перезапускається й скоро повернеться.
    disconnect:
      alone: Я залишився сам, від'єднуюся <t:{{timestamp}}:R>.
    queue:
      end:
        message: Черга закінчилася.
        prompts:
          review:
            message: Подобається {{mention}}? Залиште відгук!
            button: Залишити відгук
          vote:
            message: >-
              Подобається {{mention}}? Проголосуйте за нас, щоб більше людей
              про нас дізналися!
            button: Проголосувати
          support:
            message: Потрібна допомога чи хочете поспілкуватися? Приєднуйтеся до нашої спільноти в Discord!
            button: Приєднатися до сервера
          player:
            message: >-
              Обирайте, що грати далі, у вебплеєрі: пошук, тексти пісень і черга
              в одному місці.
            button: Відкрити вебплеєр
