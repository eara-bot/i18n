checks:
  guild_only: Цю команду можна використовувати тільки в серверах
  not_playing: Я зараз не граю музику у цьому сервері
  user_vc_none: Ви маєте бути у голосовому каналі для використання цієї команди
  user_vc_diff: Ви маєте бути в тому-ж каналі, що й я, для використання цієї команди
  queue_empty: Черга пуста
  not_interactable: Ви не можете взаємодіяти з цим повідомленням
  maintenance: Бот зараз на технічному обслуговуванні
common:
  join_our_server: 'Заходьте до нашого [Діскорд серверу]({{invite}} ) щоб дізнатись більше'
  message_deleted: "*Повідомлення видалено*"
  requested_by: На запит
  position: Позиція
  discord_server: Діскорд Сервер
  premium:
    sku_or_vote_required: >-
      Щоб використовувати цю команду, треба щоб цей сервер мапв **Преміум Підписку**. Альтернативно, 
      ви можете проголосувати за {{mention}}, та отримати *до* 12 годин доступу
    sku_required: Цьому серверу потрібна **Преміум Підписка** для доступа до цієї команди
    vote_required: |
      Для доступа до цієї команди вам треба проголосувати за {{mention}} на сайті **top.gg**
      -# Після цього ви отримаєте *до* 12 годин доступу!
events:
  command_failed: 
    message: Трапилася помилка при виконанні цієї команди
    footer: 'Надайте це розробникам: {{eid}}'
  player:
    disconnect:
      manual: Мене хтось від'єднав від голосового каналу
      alone: Мене залишили самотньою, виходжу <t:{{timestamp}}:R>
    track:
      exception:
        reason:
          time_out: Трек занадто довго грузится, спробуйте потім
          no_support: Цей трек не підтримуєтся програвачем
          no_mirror: Не вдалося знайти альтернативні джерела для програвання трека, не пробуйте грати його ще раз
          no_media: Не вдалося отримати медіа для треку, спробуйте програти його ще раз
          failure: Не вдалося програти {{track}}, не пробуйте гратии його ще раз
      stuck: Програвач застряв. Пропускаю до наступного треку...
    queue:
      next:
        requested_by: На запит {{user_mention}}
      end: Черга закінчилася
commands:
  ###
  ### Information Commands
  ###
  info:
    footer: Build Information
  ping:
    footer: Є проблеми? Заходьте до нашого Діскорд серверу
  ###
  ### Setting Commands
  ###
  default_volume:
    current: Стандартна гучність у цьому сервері встановлена на {{volume}}
    updated: Стандартна гучність тепер {{volume}}
  ###
  ### Music Commands
  ###
  fix:
    no_vc: Бот зараз не у голосовому каналі... спробуйте /join?
    success: Я спробувала виправити проблеми з підключенням
  leave:
    success: Окей, вийшла з голосового канала
  join:
    perms:
      missing: >-
        Мені потрібні права **Говорити**, **Дивитися** та **Під'єднуватися** у {{channel}}
      error: >-
        Трапилася помилка при перевірці прав для {{channel}}, повідомте про це розробникам
    success: Окей, я зайшла до {{channel}}
  skip:
    current:
      some: Пропускаю {{track}}
      none: Пропускаю до наступного треку
    to:
      some: Пропускаю до {{track}}
      none: Цього трека немає у черзі
  seek:
    unseekable: Поточний трек нельзя перемотувати
    no_duration: Поточний трек не має длину
    out_of_bounds: >-
      Позиція яку ви надали перевершить длину трека, {{given}} >
      {{length}}
    success: Перемотала до {{given}}
  loop:
    nothing:
      success: Повтор вимкнутий
      already: Повтор вже був вимкнутий
    track:
      indef: Тепер цей трек буде повторюватися
      times: Тепер цей трек повторюється *{{loop_times}}*×
      nuhuh: Поточний трек вже повторюється
    queue:
      indef: Тепер черга буде повторюватися
      times: Тепер черга повторюється *{{loop_times}}*×
      nuhuh: Черга вже повторюється
  queue:
    use_autocomplete: Хм? Спробуйте натиснути опції які автоматично показуються
    view:
      footer: Сторінка {{cur}}/{{all}} (усього {{tot}})
    move:
      not_found: Трек не знайдено у черзі
      pointless: Трек вже на той позиції # TODO: "на той" doesn't feel right
      success: "{{track}} переміщений на #{{index}}"
    clear:
      confirm: Ви впевнені що хочете опорожнити чергу?
      cancelled: Черга не опорожнена
      success: Черга опорожнена!
    remove:
      not_found: Трек не знайдено, спробуйте використовувати опції які автоматично показуються
      success: Прибрала трек {{track}} з черги
    shuffle:
      too_small: Черга занадто мала щоб перемішувати
      success: Черга перемішана
  pause:
    already: Програвач вже припинений
    success: Я припинила програвач
  resume:
    already: Програвач вже відновлений
    success: Я відновила програвач
  play:
    domain:
      other: Посилання яке ви надали, не підтримується
      youtube: Це посилання наразі не підтримується через обмеження від ютубу. Спробуйте потім, моїм розробникам треба ці обмеження обійти
        #      youtube: Eara прекратила поддержку ссылок с YouTube, из-за их ограничений на сторонние клиенты. Ссылки с других платформ, как SoundCloud или Spotify, всё ещё работают нормально

    nothing: Нічого не найдено по запросу
    error: Трапилася помилка при завантаженні вашого запросу
    queued_playlist: До черги додано {{count, number}} трек. з *{{playlist}}*
    queued_track: До черги доданий {{track}}
  stop:
    success: Програвавч зупинений
  volume:
    current: Наразі гучність {{volume}}
    out_of_bounds: Гучність повинна бути між 0 та 1000
    success: Гучність встановлена на {{volume}}
  effects:
    enabled: Ефект '*{{effect}}*' увімкнений!
    disabled: Ефект '*{{effect}}*' вимкнений!