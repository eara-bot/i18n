events:
  command_failed:
    message: Ця команда не вдалася.
    reason:
      unknown: 'Виникла неочікувана помилка, будь ласка, повідомте про це розробникам.'
      panic: >-
        Завдання, яке обробляло вашу команду, завершилося з помилкою. Будь
        ласка, повідомте про це розробникам.
    footer: 'Надайте цей ID розробникам: **{{eid}}**'
  player:
    tips:
      autoplay: >-
        Тримайте музику в роботі, коли черга закінчується, за допомогою
        {{command}}.
      crossfade: >-
        Чи знаєте ви, що ми маємо плавний перехід між піснями? Використовуйте
        {{command}}, щоб налаштувати це.
      effects: 'Надайте поточній пісні інший настрій за допомогою {{command}}.'
      history: >-
        Шукаєте щось, що гуло раніше? {{command}} також може показати історію
        черги.
      immersive: 'Використовуйте {{spatialize}} або {{orbit}}, щоб оживити свій досвід!'
      loop: >-
        Хочете почути це знову? {{command}} може повторити цю пісню або всю
        чергу.
      move: >-
        Змінюйте порядок або очищуйте чергу за допомогою {{move_command}} та
        {{remove_command}}.
      notifications: >-
        Адміністратори сервера можуть вибрати спеціальний канал програвання за
        допомогою {{command}}.
      seek: 'Перейдіть до будь-якої точки цієї пісні за допомогою {{command}}.'
      shuffle: 'Перемішайте пісні, що чекають у черзі, за допомогою {{command}}.'
      voice_status: >-
        Адміністратори сервера можуть показувати поточну пісню у статусі
        голосового каналу за допомогою {{command}}.
    notification:
      join_failed: Не вдалося приєднатися до вашого голосового каналу.
      playback_failed: 'Не вдалося відтворити {{track}}'
      scheduler_failed: >-
        Планувальник програвача для цього сервера зазнав збою. Будь ласка,
        виконайте `/leave`, потім `/join`, і повідомте про це, якщо проблема
        повториться.
      playback_stalled: >-
        Занадто багато невдалих спроб відтворення. Якщо це триватиме, будь
        ласка, приєднайтесь до нашого сервера підтримки.
      idle_timeout: Гравчика було вимкнено через тривалу неактивність.
      restarting: Eara перезапускається й незабаром має повернутися.
    disconnect:
      alone: 'Я залишився самотнім, від''єднання <t:{{timestamp}}:R>'
    queue:
      end:
        message: Черга завершена.
        prompts:
          review:
            message: 'Подобається {{mention}}? Залиште нам відгук!'
            button: Залишити відгук
          vote:
            message: >-
              Подобається {{mention}}? Проголосуйте за нас, щоб допомогти
              більшій кількості людей знайти нас!
            button: Проголосувати за нас
          support:
            message: >-
              Потрібна допомога або хочете приєднатися? Приєднуйтесь до нашої
              спільноти в Discord!
            button: Приєднатися до сервера
