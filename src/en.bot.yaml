checks:
  guild_only: This command may only be used in a server.
  not_playing: I'm not playing music in this server.
  user_vc_none: You must be in a voice channel to use this command.
  user_vc_diff: You must be in the same voice channel as me to use this command.
  queue_empty: The queue is empty.
  not_interactable: You cannot interact with this message.
  maintenance: The bot is undergoing maintenance, check back later.
common:
  join_our_server: "Join our [*Discord Server*]({{invite}} ) for more information"
  message_deleted: "*Message was deleted*"
  requested_by: Requested By
  position: Position
  vote: Vote on Top.gg
  discord_server: Support Server
  premium:
    sku_or_vote_required: This server requires a **Premium Subscription** to access this command. Alternatively, you can vote to receive *up-to* 12 hours of uninterrupted access.
    sku_required: This server requires a **Premium Subscription** to access this command.
    uninterrupted_access: After voting you will receive *up-to* 12 hours of uninterrupted access!
    vote_required: |
      You must vote for {{mention}} on **top.gg** to gain access to this command.
      -# $t(common.premium.uninterrupted_access)
buttons:
  remove:
    none: I couldn't find the item you wanted to remove...
    done: "{{author}} removed {{track}} from the queue."
  correlated_remove:
    none: The song(s) that were queued are nowhere to be found...
    done: "{{author}} removed {{count}} songs that were queued."
  play_now:
    none: I could not find the songs you added in the queue, have you played them already?
    done_one: Prioritized one song requested by {{requester}}.
    done_other: Prioritized {{count}} songs requested by {{requester}}.
    footer_a: Skipped to {{next}} from {{prev}}
    footer_b: Skipped to {{next}}
  stop: "{{user}} has stopped the player."
events:
  command_failed:
    message: This command has failed.
    reason:
      unknown: An unexpected error has been raised, please report this to the developers.
      panic: The task which was processing your command has panicked, please report this to the developers.
    footer: "Give this ID to the developers: **{{eid}}**"
  player:
    skip:
      none: "{{user_mention}}... there is nothing to skip to."
      to_prev: "{{user_mention}} skipped to the previous song"
      to_next: "{{user_mention}} skipped to the next song"
    disconnect:
      manual: I was manually disconnected from the voice channel.
      alone: I was left all alone, disconnecting <t:{{timestamp}}:R>
      join_failed: I failed to join your voice channel. If {{mention}} continues to fail, please join our Discord Server!
    track:
      exception:
        $:
          no_replay: Do __**NOT**__ try to replay this song.
        reason:
          time_out: The song timed out, please try again later.
          no_support: The song is not supported by the player.
          no_mirror: Could not find a suitable source to play from, do not attempt replaying the song.
          no_media: Failed to retrieve the media for the song, try replaying it.
          unknown: Failed to play {{track}}, do not attempt to replay it.
          youtube:
            age_restricted: This video requires age-verification.
            copyright: This video is unavailable due to copyright issues
            geo_blocked: The uploader has blocked this video in the U.S.
            unavailable: This video is no longer available.
            processing: No formats available for this video.
            unknown: This video could not be played.
      stuck: The player got stuck. Skipping to the next song...
    queue:
      next:
        requested_by: Requested by {{user_mention}}
        auto_playing: ":sparkles: Auto-playing Recommended Songs"
      end:
        message: The queue has ended.
        footers:
          - Enjoying {{mention}}? Consider reviewing it [here](<{{links.review}}>).
          - Enjoying {{mention}}? Consider voting for it [here](<{{links.vote}}>).
          - Enjoying {{mention}}? Consider joining our [Discord Community](<{{links.support}}>).
commands:
  ###
  ### Information Commands
  ###
  info:
    footer: Build Information
  ping:
    footer: Having issues? Join our **Support Server**!
  ###
  ### Setting Commands
  ###
  default_volume:
    current: The default volume for this server is currently {{volume, number}}.
    updated: Updated the default volume for this server to {{volume, number}}.
  do_vc_status_update:
    current:
      enabled: "Currently, {{mention}} will update the voice channel status when the current song changes."
      disabled: "Currently, {{mention}} will not update the voice channel status when the current song changes."
    updated:
      enabled: "{{mention}} will now update the voice channel status when the current song changes."
      disabled: "{{mention}} will no longer update the voice channel status when the current song changes."
  autoplay:
    current:
      enabled: "Currently, {{mention}} will auto-play recommended songs."
      disabled: "Currently, {{mention}} is not auto-playing recommended songs."
    updated:
      enabled: "{{mention}} will now auto-play recommended songs."
      disabled: "{{mention}} will no longer auto-play recommended songs."
  notifications:
    channel:
      current:
        none: "{{mention}} is not sending notifications to a specific channel."
        some: "{{mention}} is currently sending notifications to {{channel}}"
      clear: "{{mention}} will no longer send notifications to a specific channel."
      update: "{{mention}} will now send notifications to {{channel}}"
  ###
  ### Music Commands
  ###
  fix:
    no_vc: The bot isn't in a voice channel... try using /join?
    success: I've attempted to fix connection issues.
  leave:
    success: Okay, I left your voice channel.
  join:
    conflict: I'm already in a voice channel.
    failure: I failed to join that voice channel.
    in_progress: I am already joining that voice channel.
    perms:
      missing: >-
        I need permissions to **view**, **connect**, and **speak** in
        {{channel}}.
      error: >-
        I failed to fetch permissions for {{channel}}, report this to the
        developers.
    success: Okay, I joined {{channel}}.
  skip:
    current:
      some: Skipped {{track}} for the {{kind}} song.
      none: Skipped to the {{kind}} song.
    to:
      invalid: I didn't recognize the song you gave me. Try using auto-complete :)
      some: Skipped to {{track}}.
      none: I could not skip to that song, is it still in the queue?
  seek:
    unseekable: The current song is not seekable.
    no_duration: The current song has no duration.
    syntax: The timecode must be in the format `mm:ss`
    out_of_bounds: >-
      The position you gave will exceeed the length of the current song, {{given}} >
      {{length}}
    success: Seeked to {{given}}
  loop:
    nothing:
      success: Looping has been disabled.
      already: Looping was already disabled.
    track:
      indef: Now looping the the current song indefinitely.
      times_one: The current song will loop once.
      times_other: The current song will now loop for *{{count, number}} times*.
      nuhuh: The current song is already been looped.
    queue:
      indef: Now looping the queue indefinitely.
      times_one: The queue will loop once.
      times_other: The queue will now loop for *{{count, number}} times*.
      nuhuh: The queue is already looping.
  queue:
    use_autocomplete: Hm? Try using the autocomplete to select a queued song.
    view:
      footer: Page {{cur, number}}/{{all, number}} ({{tot, number}} total)
    move:
      failed: Could not move that song to the requested position.
      success: "Moved {{track}} to #{{index, number}}"
    clear:
      confirm: Are you sure you want to clear the queue?
      cancelled: The queue was not cleared.
      none: The queue was empty.
      success_one: Removed 1 song from the queue.
      success_other: Removed {{count, number}} songs from the queue.
    remove:
      not_found: The provided song was not found in the queue, try using autocomplete.
      success: Removed {{track}} from the queue.
    shuffle:
      too_small: The queue is too small to be shuffled.
      success: The queue has been shuffled.
  pause:
    already: The player is already paused.
    success: I've paused the player.
  resume:
    server_muted: Cannot resume the player while i'm server muted.
    already: The player wasn't paused
    success: I've resumed the player.
  play:
    domain:
      other: The link you provided is not supported.
      youtube: Eara has temporarily removed support for YouTube links.
      vote_locked: |
        You must vote for {{mention}} on **top.gg** for access to `{{domain}}` links!
        -# $t(common.premium.uninterrupted_access)
    nothing: Nothing was returned for your query.
    error: An error occurred while loading your query.
    timeout: |
      I could not find a result for your query in a timely manner.
      -# If this happens again please join our **Discord Server** to report it!
    queued_playlist_one: Queued a single song from {{kind}} *{{playlist}}*
    queued_playlist_other: Queued {{count, number}} songs from {{kind}} *{{playlist}}*
    queued_track: Queued {{track}}
  stop:
    success: The player has been stopped.
  volume:
    current: The current volume is {{volume, number}}.
    out_of_bounds: The volume must be between 0 and 255.
    success: The volume has been set to {{volume, number}}.
  effects:
    enabled: Enabled the '*{{effect}}*' effect!
    disabled: Disabled the '*{{effect}}*' effect!
  lyrics:
    error: >+
      An error occurred while fetching the lyrics for {{track}}.
      Do not attempt to retry.
    missing: No lyrics available for {{track}}.
