checks:
  guild_only: This command may only be used in a server.
  not_playing: I'm not playing music in this server.
  user_vc_none: You must be in a voice channel to use this command.
  user_vc_diff: You must be in the same voice channel as me to use this command.
  queue_empty: The queue is empty.
  nothing_playing: Nothing is playing.
  unknown_command: I don't recognize this command...
  owner_only: You are not allowed to use this command.
  missing_permissions: You need the {{permissions}} permission(s) to use this command.
  maintenance: The bot is undergoing maintenance, check back later.
  tier_required: >-
    This server's plan doesn't include me. Subscribe at {{website}} to use me
    here.
  tier_lapsed: >-
    This server's subscription has ended, so I've stopped playing. Renew at
    {{website}} to start again.
  voice_channel_not_allowed: "I can only play in these channels here: {{channels}}."
  dj_only:
    role: >-
      DJ mode is on, so only people with {{role}} or the **Manage Server**
      permission can do that.
    managers: >-
      DJ mode is on, so only people with the **Manage Server** permission can
      do that.
stage:
  hand_raised: >-
    I've raised my hand on the stage. A stage moderator needs to invite me to
    speak before anyone can hear the music.
  cannot_speak: >-
    I'm in the stage audience and can't ask to speak. Give me **Request to
    Speak**, or invite me to speak yourself.
common:
  join_our_server: >-
    Join our [*Discord Server*]({{invite}} ) for more information
  message_deleted: "*Message was deleted*"
  vote: Vote on Top.gg
  discord_server: Support Server
  help_center: Help Center
  open_player: Open player
  open_in_web_player: Open in web player
  remove: Remove
  play_now: Play Now
  next: Next
  previous: Previous
  unknown_artist: Unknown Artist
  unavailable_track: "[unavailable track metadata]"
  unknown_url: Unknown URL
  unsupported_url: Unsupported URL
  supported_sites: Supported Sites
  source_url: "{{source}} URL"
  unknown: Unknown
  unknown_channel: Unknown Channel
  none: None
  not_available: N/A
  yes: Yes
  no: No
  track: Track
  queue: Queue
  state:
    loading: Loading
    paused: Paused
    playing: Playing
    idle: Idle
    active: Active
    on: On
    off: Off
    disconnected: Disconnected
    joining: Joining
    reconnecting: Reconnecting
    connected: Connected
  confirmation:
    prompt: |-
      {{message}}
      -# You have **30 seconds** to respond.
    confirm: Confirm
    deny: Deny
  premium:
    sku_required: >-
      This server requires a **Premium Subscription** to access this command.
    pricing_pitch: >-
      -# Plans start at **{{price}}/month** for higher audio quality, bigger
      queues, and YouTube access.
    uninterrupted_access: >-
      After voting you will receive *up-to* 12 hours of uninterrupted access!
    vote_required: >-
      You must vote for {{mention}} on **top.gg** to gain access to this
      command.

      -# $t(common.premium.uninterrupted_access)
    get_premium: Get Premium
    vote_locks_premium: "**Premium** removes vote locks for the whole server."
buttons:
  remove:
    none: I couldn't find the item you wanted to remove...
    done: "{{author}} removed {{track}} from the queue."
  correlated_remove:
    none: The song(s) that were queued are nowhere to be found...
    done: "{{author}} removed {{count}} songs that were queued."
  play_now:
    none: >-
      I could not find the songs you added in the queue, have you played them
      already?
    not_found: Could not find that song in the queue.
    done_one: Prioritized one song requested by {{requester}}.
    done_other: Prioritized {{count}} songs requested by {{requester}}.
    footer_a: Skipped to {{next}} from {{prev}}.
    footer_b: Skipped to {{next}}.
  item_actions:
    not_found: That song is no longer in the queue.
  previous:
    none: There are no previous songs...
  skip_to: "{{user}} skipped to {{track}}."
  stop: "{{user}} stopped the player."
events:
  command_failed:
    message: Something went wrong
    reason:
      unknown: Try again in a moment.
      player_restarted: The player had to restart. Try that again.
    footer: >-
      Error ID `{{eid}}` · share it in our Support Server if this keeps
      happening.
    usage: "That doesn't look right. Here's how to use it:"
  player:
    tips:
      autoplay: Keep the music going when the queue ends with {{command}}.
      crossfade: >-
        Did you know we have cross-fading? Use {{command}} to configure it.
      effects: Give the current song a different feel with {{command}}.
      history: >-
        Looking for something played earlier? {{command}} can also show queue
        history.
      immersive: Use {{spatialize}} or {{orbit}} to liven up your experience!
      last_fm: >-
        Link your Last.fm account with {{command}} to scrobble everything you
        listen to here.
      loop: >-
        Want to hear it again? {{command}} can repeat this song or the whole
        queue.
      move: >-
        Reorder or clean up the queue with {{move_command}} and
        {{remove_command}}.
      notifications: >-
        Server managers can choose a dedicated player channel with {{command}}.
      player_web: >-
        Follow live lyrics and manage the queue in the [web player]({{url}}).
      seek: Jump to any point in this song with {{command}}.
      shuffle: Mix up the songs waiting in the queue with {{command}}.
      voice_status: >-
        Server managers can show the current song in the voice-channel status
        with {{command}}.
    notification:
      join_failed: I failed to join your voice channel.
      playback_failed: Failed to play {{track}}.
      scheduler_failed: >-
        The player scheduler for this server failed. Please run `/leave`, then
        `/join`, and report this if it happens again.
      playback_stalled: >-
        Too many failed playback attempts. If this continues, please join our
        Support Server.
      idle_timeout: The player was idle for too long, so I disconnected.
      restarting: Eara is restarting and should be back shortly.
    disconnect:
      alone: I was left all alone, disconnecting <t:{{timestamp}}:R>.
    queue:
      end:
        message: The queue has ended.
        prompts:
          review:
            message: Enjoying {{mention}}? Leave us a review!
            button: Leave a review
          vote:
            message: >-
              Enjoying {{mention}}? Vote for us to help more people find it!
            button: Vote for us
          support:
            message: Need help or want to hang out? Join our Discord community!
            button: Join our server
          player:
            message: >-
              Pick what plays next from the web player: search, lyrics and the
              queue in one place.
            button: Open web player
commands:
  ###
  ### Information Commands
  ###
  debug:
    footer: Share this summary when asking for player help.
    loop_indefinite: "{{mode}} (indefinite)"
    loop_remaining: "{{mode}} ({{count, number}} remaining)"
  dev:
    entitlement_granted: >-
      Granted entitlement {{entitlement}} for SKU {{sku}} to guild {{guild}}.
    player_not_found: No player exists for guild {{guild}}.
    joining: Joining {{channel}} ({{connection}})
    reconnecting: Reconnecting to {{channel}} ({{connection}})
    connected: Connected to {{channel}} ({{connection}})
  help:
    details: "-# Use `/help` for details on any command."
    player: "-# Live lyrics, the queue and controls are also in the [web player]({{url}})."
    supported_sites: "-# Not sure a link will work? See [which sites eara can play from]({{url}})."
  ping:
    message: Pong!
    footer: Having issues? Check the **Help Center** or join our **Support Server**.
  stats:
    instance_failed: Failed to retrieve instance.
  ###
  ### Setting Commands
  ###
  autoplay:
    enabled: "{{user}} turned on autoplay."
    disabled: "{{user}} turned off autoplay."
    turn_on: Turn on autoplay
    turn_off: Turn off autoplay
  crossfade:
    current:
      "on": Crossfade is {{seconds, number}}s.
      "off": Crossfade is off.
    updated:
      "on": "{{user}} set crossfade to {{seconds, number}}s."
      "off": "{{user}} turned off crossfade."
    "off": "Off"
    seconds: "{{seconds, number}}s"
  scope:
    server: Saved for the whole server.
    session: >-
      Until the player stops. Someone with Manage Server can save it for the
      server, here or in {{command}}.
  dj:
    current:
      "on": DJ mode is **on**. Only DJs can control the player.
      "off": DJ mode is **off**. Everyone in the call can control the player.
    who:
      role: >-
        DJs are members with {{role}}, anyone with Manage Server, and anyone
        alone in the call with me.
      managers: >-
        DJs are anyone with Manage Server, and anyone alone in the call with
        me.
    you:
      "yes": You can control the player.
      "no": You can't control the player right now.
    updated:
      "on": "{{user}} turned on DJ mode."
      "off": "{{user}} turned off DJ mode."
      role: "{{user}} set the DJ role to {{role}}."
      no_role: "{{user}} removed the DJ role."
    turn_on: Turn on DJ mode
    turn_off: Turn off DJ mode
    role_placeholder: No DJ role
  settings:
    title: Settings
    footer: >-
      Changes save right away. Everything here is also on the
      [dashboard]({{url}}).
    pages:
      playback: Playback
      dj: DJ
      queue: Queue
      voice: Voice
      bot: This bot
    about:
      playback: How the music starts, sounds and keeps going, for the whole server.
      dj: Who controls the player, and how a skip is decided.
      queue: What can be added to the queue, and in what order it plays.
      voice: Where our bots can play in this server, unless one has its own list.
      bot: >-
        Just for {{bot}}. Each of our bots in this server has its own, and
        anything left empty follows the server's settings.
    state:
      "on": "On"
      "off": "Off"
    turn_on: Turn on
    turn_off: Turn off
    change: Change
    premium: Premium
    invalid: Enter a whole number from {{min, number}} to {{max, number}}.
    invalid_optional: >-
      Enter a whole number from {{min, number}} to {{max, number}}, or leave it
      empty.
    playback:
      volume:
        label: Starting volume
        about: How loud I start playing.
        input: From 0 to 250.
      crossfade:
        label: Crossfade
        about: Blends the end of each song into the next.
        value: "{{seconds, number}}s"
        input: Seconds, from 0 to 30. 0 turns it off.
      autoplay:
        label: Autoplay
        about: Keeps the music going with similar songs when the queue runs out.
      vc_status:
        label: Voice channel status
        about: Shows what's playing as the voice channel's status.
      notifications:
        label: Now-playing channel
        about: >-
          Where I post each song. Leave it empty to post where the music was
          started.
        placeholder: Where the music was started
    dj:
      mode:
        label: DJ mode
        about: >-
          Only DJs can control the player. Everyone can still add songs and vote
          to skip.
      role:
        label: DJ role
        about: >-
          Members with this role are DJs, as is anyone with Manage Server or
          alone in the call with me.
        placeholder: No DJ role
      max_volume:
        label: Volume limit
        about: The loudest someone who isn't a DJ can set.
        none: No limit
        input: From 0 to 250. Leave it empty for no limit.
      vote_skip:
        label: Votes to skip
        about: The share of listeners it takes to skip a song.
        none: More than half
        value: "{{percent, number}}%"
        input: A percentage, from 1 to 100. Leave it empty for more than half.
    queue:
      no_duplicates:
        label: No duplicates
        about: Songs already in the queue can't be added again.
      fair:
        label: Fair queue
        about: Takes turns between the people adding songs.
      leave_cleanup:
        label: Leave cleanup
        about: Removes someone's songs 30 seconds after they leave the call.
      max_songs:
        label: Songs per person
        about: How many songs someone who isn't a DJ can have queued.
        none: No limit
        input: From 1 to 1000. Leave it empty for no limit.
      max_length:
        label: Longest song
        about: The longest song someone who isn't a DJ can add.
        none: No limit
        value_one: 1 minute
        value_other: "{{count, number}} minutes"
        input: In minutes, from 1 to 1440. Leave it empty for no limit.
    voice:
      channels:
        label: Voice channels
        about: Where I can play. Leave it empty to play in any voice channel.
        placeholder: Any voice channel
    bot:
      always_on:
        label: 24/7 channel
        about: >-
          A channel this bot joins on its own and stays in, even when the music
          stops.
        placeholder: None
        taken: >-
          {{bot}} already stays in that channel around the clock. Pick another
          one.
      voice:
        label: Voice channels
        about: >-
          Where this bot can play. Leave it empty to follow the server's voice
          channels.
        any: >-
          This bot can play in any voice channel, whatever the server's say.
          Pick some to keep it to those.
        placeholder: The server's voice channels
      notifications:
        label: Now-playing channel
        about: Where this bot posts each song, instead of the server's channel.
        placeholder: The server's channel
      volume:
        label: Starting volume
        about: How loud this bot starts, instead of the server's volume.
        none: The server's ({{volume, number}})
        input: From 0 to 250. Leave it empty to use the server's.
  history:
    title: Recently played
    footer: Press a number to queue that song again.
    empty: Nothing has been requested here yet.
    not_playing: I'm not playing in this server. Use `/play` to start.
    gone: I couldn't find that song again. Try `/play` instead.
    queued: "{{user}} queued {{track}} again."
  ###
  ### Music Commands
  ###
  leave:
    success_channel: Left {{channel}}.
    destroyed: Stopped the player for this server.
  join:
    conflict: I'm already in a voice channel.
    failure: I failed to join that voice channel.
    in_progress: I am already joining that voice channel.
    perms:
      missing: >-
        I need permissions to **view**, **connect**, and **speak** in
        {{channel}}.
    success: Joined {{channel}}.
  skip:
    success: "{{user}} skipped the song."
    vote:
      counted: >-
        {{user}} voted to skip the song. ({{votes, number}}/{{needed, number}})
      repeated: >-
        You already voted to skip this song.
        ({{votes, number}}/{{needed, number}})
      passed: "{{user}} voted to skip, and the vote passed. Skipping the song."
      requester_gone: >-
        {{user}} skipped the song. Whoever queued it has left the call, so no
        vote was needed.
    to:
      invalid: >-
        I didn't recognize the song you gave me. Try using auto-complete :)
      none: I could not skip to that song, is it still in the queue?
  seek:
    unseekable: The current song is not seekable.
    no_duration: The current song has no duration.
    syntax: The timecode must be in the format `mm:ss`.
    out_of_bounds: >-
      That position is past the end of the current song ({{given}} > {{length}}).
    success: "{{user}} jumped to {{given}}."
  loop:
    nothing:
      success: "{{user}} turned off looping."
      already: Looping is already off.
    track:
      indef: "{{user}} set the current song to loop."
      times_one: "{{user}} set the current song to loop once."
      times_other: "{{user}} set the current song to loop {{count, number}} times."
      nuhuh: The current song is already looping.
    queue:
      indef: "{{user}} set the queue to loop."
      times_one: "{{user}} set the queue to loop once."
      times_other: "{{user}} set the queue to loop {{count, number}} times."
      nuhuh: The queue is already looping.
  queue:
    use_autocomplete: Hm? Try using the autocomplete to select a queued song.
    view:
      footer: Page {{cur, number}}/{{all, number}} ({{tot, number}} total)
    move:
      failed: Could not move that song to the requested position.
      success: "{{user}} moved {{track}} to #{{index, number}}."
    clear:
      none: The queue was empty.
      success_one: "{{user}} cleared 1 song from the queue."
      success_other: "{{user}} cleared {{count, number}} songs from the queue."
    remove:
      confirm: Are you sure you want to remove {{track}} from the queue?
      cancelled: Okay, I won't remove that song.
      not_found: >-
        The provided song was not found in the queue, try using autocomplete.
      success: "{{user}} removed {{track}} from the queue."
    shuffle:
      too_small: The queue is too small to be shuffled.
      success: "{{user}} shuffled the queue."
  now_playing:
    autoplay: Autoplay
    requested_by: Requested by
    ends: Ends
    queue: Queue
    queue_summary: "{{queued, number}} queued · {{played, number}} played"
    up_next: Up next
    refresh: Refresh
    open: Open
  pause:
    already: The player is already paused.
    success: "{{user}} paused the player."
  resume:
    server_muted: I can't resume while I'm server muted.
    already: The player isn't paused.
    success: "{{user}} resumed the player."
  play:
    duplicate: That's already in the queue.
    over_limit_one: You can only have 1 song in the queue at a time here.
    over_limit_other: >-
      You can only have {{count, number}} songs in the queue at a time here.
    too_long_one: Songs here can't be longer than 1 minute.
    too_long_other: Songs here can't be longer than {{count, number}} minutes.
    too_long_skipped_one: >-
      Skipped 1 song longer than {{minutes, number}} minutes.
    too_long_skipped_other: >-
      Skipped {{count, number}} songs longer than {{minutes, number}} minutes.
    over_limit_skipped_one: >-
      Skipped 1 song: you can have {{limit, number}} queued at a time.
    over_limit_skipped_other: >-
      Skipped {{count, number}} songs: you can have {{limit, number}} queued at
      a time.
    duplicates_skipped_one: Skipped 1 song that was already in the queue.
    duplicates_skipped_other: >-
      Skipped {{count, number}} songs that were already in the queue.
    domain:
      other: The link you provided is not supported.
      youtube: Eara has temporarily removed support for YouTube links.
      vote_locked: >-
        You must vote for {{mention}} on **top.gg** for access to `{{domain}}`
        links!

        -# $t(common.premium.uninterrupted_access)
    nothing: Nothing was returned for your query.
    error: An error occurred while loading your query.
    invalid_url: You passed an invalid URL.
    queue_full: >-
      The queue does not have enough room. Remove some songs before adding more.
    added: "{{user}} added {{item}} to the queue."
    loaded:
      album_one: one song from album {{collection}}
      album_other: "{{count, number}} songs from album {{collection}}"
      artist_one: "*{{collection}}*'s top song"
      artist_other: "*{{collection}}*'s top {{count, number}} songs"
      playlist_one: one song from playlist *{{collection}}*
      playlist_other: "{{count, number}} songs from playlist *{{collection}}*"
  last_fm:
    unavailable: Last.fm connections are not available right now.
    account: Account
    connect:
      prompt: >-
        Open the link below to connect your Last.fm account. It works once and
        expires in {{minutes, number}} minutes, so keep it to yourself.
      button: Connect Last.fm
      open: Open Last.fm
    disconnect:
      button: Disconnect
      done: Last.fm account disconnected.
    status:
      unlinked: You haven't connected a Last.fm account yet.
    scrobbling:
      label: Scrobbling
      turn_on: Turn scrobbling on
      turn_off: Turn scrobbling off
      enabled: Scrobbling turned on.
      disabled: Scrobbling turned off. Your account stays connected.
  stop:
    success: "{{user}} stopped the player."
  volume:
    current: The volume is {{volume, number}}.
    success: "{{user}} set the volume to {{volume, number}}."
    over_limit: >-
      Only DJs can set the volume above {{limit, number}} in this server.
  effects:
    enabled: "{{user}} turned on *{{effect}}*."
    disabled: "{{user}} turned off *{{effect}}*."
    trial_enabled: "{{user}} turned on *{{effect}}* for the current song."
    trial_disabled: "{{user}} turned off *{{effect}}* for the current song."
    cleared: "{{user}} turned off all effects."
    list:
      none: No effects are on.
      some: "Effects on: {{effects}}."
  always_on:
    enabled: >-
      {{user}} turned on 24/7. I'll stay in the call until someone uses
      `/leave`.
    disabled: >-
      {{user}} turned off 24/7. I'll leave once the music stops or everyone
      leaves.
    already:
      enabled: 24/7 is already on.
      disabled: 24/7 is already off.
    saved: >-
      {{channel}} is now my 24/7 channel. I'll join it on my own whenever I'm
      not playing somewhere else in this server.
    forgotten: >-
      I'll stop coming back to my 24/7 channel. If I'm in it now, I'll stay
      until someone turns 24/7 off or uses `/leave`.
    not_voice: That isn't a voice or stage channel.
    turn_on: Turn on 24/7
    turn_off: Turn off 24/7
    keep: Always come back here
    forget: Stop coming back
  immersive:
    disabled: "{{user}} turned off immersive mode."
