        Administratorzy serwera mogą wyświetlać aktualnie odtwarzany utwór w
        statusie kanału głosowego za pomocą {{command}}.
    notification:
      join_failed: Nie udało mi się dołączyć do Twojego kanału głosowego.
      playback_failed: 'Nie udało się odtworzyć {{track}}'
      scheduler_failed: >-
        Harmonogram odtwarzacza dla tego serwera uległ awarii. Uruchom proszę
        `/leave`, a następnie `/join` i zgłoś to ponownie, jeśli problem będzie
        się powtarzał.
      playback_stalled: >-
        Zbyt wiele nieudanych prób odtworzenia. Jeśli problem będzie się
        powtarzał, dołącz do naszego Serwera Wsparcia.
      idle_timeout: 'Odtwarzacz był zbyt długo bezczynny, więc zostałem rozłączony.'
      restarting: Eara uruchamia się ponownie i powinna wkrótce wrócić.
    disconnect:
      alone: 'Zostałem sam, rozłączam się <t:{{timestamp}}:R>'
    queue:
      end:
        message: Kolejka została zakończona.
        prompts:
          review:
            message: 'Cieszysz się {{mention}}? Zostaw nam opinię!'
            button: Zostaw opinię
          vote:
            message: >-
              Cieszysz się {{mention}}? Zagłosuj na nas, aby więcej osób mogło
              nas znaleźć!
            button: Zagłosuj na nas
          support:
            message: >-
              Potrzebujesz pomocy lub chcesz porozmawiać? Dołącz do społeczności
              Discord!
            button: Dołącz do serwera
