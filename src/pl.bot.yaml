events:
  command_failed:
    message: Ta komenda nie powiodła się.
    reason:
      unknown: 'Wystąpił nieoczekiwany błąd, prosimy o zgłoszenie go deweloperom.'
      panic: >-
        Zadanie przetwarzające Twoją komendę uległo awarii, prosimy o zgłoszenie
        tego deweloperom.
    footer: 'Przekaż ten ID deweloperom: **{{eid}}**'
  player:
    tips:
      autoplay: 'Kontynuuj muzykę po zakończeniu kolejki za pomocą {{command}}.'
      crossfade: >-
        Czy wiedziałeś, że oferujemy płynne przejścia? Skorzystaj z {{command}},
        aby je skonfigurować.
      effects: 'Dodaj obecnemu utworowi inny klimat za pomocą {{command}}.'
      history: >-
        Szukasz czegoś, co było wcześniej odtwarzane? {{command}} może również
        pokazywać historię kolejki.
      immersive: 'Skorzystaj z {{spatialize}} lub {{orbit}}, aby wzbogacić swoje wrażenia!'
      loop: >-
        Chcesz to ponownie usłyszeć? {{command}} może powtarzać ten utwór lub
        całą kolejkę.
      move: >-
        Zmień kolejność lub wyczyść kolejkę za pomocą {{move_command}} i
        {{remove_command}}.
      notifications: >-
        Administratorzy serwera mogą wybrać dedykowany kanał odtwarzacza za
        pomocą {{command}}.
      seek: 'Przejdź do dowolnego momentu tego utworu za pomocą {{command}}.'
      shuffle: 'Wymieszaj utwory oczekujące w kolejce za pomocą {{command}}.'
